[project]
name = "scraper-lab"
version = "0.1.0"
description = "Projetos de scraping sobre ScrapeGraph-AI"
requires-python = ">=3.12,<4.0"
dependencies = [
    "scrapegraphai",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "dnspython>=2.8.0",
    "truststore>=0.10.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.25.0"]

[tool.uv.sources]
scrapegraphai = { path = "../Scrapegraph-ai", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper_lab"]
