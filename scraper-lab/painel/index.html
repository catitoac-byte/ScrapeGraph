<title>Vitrine Goiânia</title>
<meta name="description" content="C&A, Renner e Riachuelo comparadas loja a loja em Goiânia: movimento por hora, reputação e voz do cliente no Google.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#EEF1F5; --panel:#FFFFFF; --panel-2:#F6F8FB; --sunk:#E4E8EE;
  --ink:#0D131D; --ink-2:#465163; --ink-3:#768193; --line:#DAE0E8; --line-2:#C7CFDA;
  --focus:#0D131D; --chip:#E6EAF0; --chip-on:#0D131D; --chip-on-ink:#FFFFFF;
  --b0:#2a78d6; --b1:#eb6834; --b2:#1baf7a;
  --b0-soft:#2a78d61f; --b1-soft:#eb68341f; --b2-soft:#1baf7a1f;
  --good:#16864a; --warn:#b7791f; --crit:#c53030;
  --good-bg:#16864a17; --warn-bg:#b7791f1c; --crit-bg:#c530301a;
  --heat-0:#F1F4F8;
  --shadow:0 1px 0 #0d131d0a, 0 8px 24px -16px #0d131d33;
  --f-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B0E13; --panel:#12161E; --panel-2:#171C26; --sunk:#0E1218;
    --ink:#EDF1F6; --ink-2:#A6B0BE; --ink-3:#737E8E; --line:#232A36; --line-2:#323B49;
    --focus:#EDF1F6; --chip:#1C222D; --chip-on:#EDF1F6; --chip-on-ink:#0B0E13;
    --b0:#3987e5; --b1:#d95926; --b2:#199e70;
    --b0-soft:#3987e52b; --b1-soft:#d959262b; --b2-soft:#199e702b;
    --good:#3ec27a; --warn:#e0a84a; --crit:#f07070;
    --good-bg:#3ec27a1f; --warn-bg:#e0a84a1f; --crit-bg:#f070701f;
    --heat-0:#161B24;
    --shadow:0 1px 0 #0000004d, 0 10px 30px -18px #000000cc;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0E13; --panel:#12161E; --panel-2:#171C26; --sunk:#0E1218;
  --ink:#EDF1F6; --ink-2:#A6B0BE; --ink-3:#737E8E; --line:#232A36; --line-2:#323B49;
  --focus:#EDF1F6; --chip:#1C222D; --chip-on:#EDF1F6; --chip-on-ink:#0B0E13;
  --b0:#3987e5; --b1:#d95926; --b2:#199e70;
  --b0-soft:#3987e52b; --b1-soft:#d959262b; --b2-soft:#199e702b;
  --good:#3ec27a; --warn:#e0a84a; --crit:#f07070;
  --good-bg:#3ec27a1f; --warn-bg:#e0a84a1f; --crit-bg:#f070701f;
  --heat-0:#161B24;
  --shadow:0 1px 0 #0000004d, 0 10px 30px -18px #000000cc;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1360px;margin:0 auto;padding-inline:24px;padding-block:0 64px}
@media (max-width:640px){.wrap{padding-inline:16px}}

/* cabecalho */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px;padding-block:28px 18px}
.brandmark{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,4vw,44px);line-height:1;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1 .amp{color:var(--ink-3);font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--ink-2);font-size:12.5px}
.meta b{color:var(--ink);font-weight:600}
.legend{display:flex;gap:8px;flex-wrap:wrap}
.lg{display:inline-flex;align-items:center;gap:8px;padding:7px 12px 7px 9px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:13px}
.sw{width:12px;height:12px;display:inline-block;flex:none}
.sh0{border-radius:50%}.sh1{border-radius:2px}.sh2{clip-path:polygon(50% 0,100% 100%,0 100%)}

/* barra de filtros */
.filters{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-inline:-24px;padding:10px 24px}
@media (max-width:640px){.filters{margin-inline:-16px;padding-inline:16px}}
.frow{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label,.flabel{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
select,input[type=search]{height:34px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);padding:0 10px;min-width:0;max-width:100%}
input[type=search]{width:200px}
.seg{display:flex;flex-wrap:wrap;background:var(--chip);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;height:28px;padding:0 9px;font-weight:600;font-size:12.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px #0d131d26}
.stars button{min-width:30px}
.active{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center;min-height:0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--chip);padding:3px 4px 3px 10px;font-size:12px;font-weight:600}
.pill button{border:0;background:var(--panel);border-radius:999px;width:20px;height:20px;line-height:1;color:var(--ink-2)}
.linkbtn{border:0;background:none;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;font-size:12px;padding:2px 4px}

/* abas */
.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:16px 4px;scrollbar-width:none}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:8px;font-weight:600;color:var(--ink-3);white-space:nowrap;font-size:14px}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--panel);box-shadow:var(--shadow)}
.tabs .ai{color:var(--ink-2)}

/* grade e paineis */
.grid{display:grid;gap:16px;margin-top:14px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:980px){.g3,.g2,.g21{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
h2{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0;font-weight:700}
.sub{color:var(--ink-2);font-size:12.5px;margin:3px 0 0;max-width:68ch}
.note{color:var(--ink-3);font-size:12px}

/* cartoes de marca */
.brandcard{position:relative;overflow:hidden;padding:0;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.bc-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 12px;border-bottom:1px solid var(--line)}
.bc-name{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.bc-stores{font-size:12px;color:var(--ink-2)}
.bc-hero{display:flex;align-items:flex-end;gap:14px;padding:16px 18px 6px}
.bc-big{font-family:var(--f-display);font-weight:800;font-size:52px;line-height:.9;letter-spacing:-.03em}
.bc-stars{display:flex;flex-direction:column;gap:3px;padding-bottom:4px}
.starrow{display:flex;gap:2px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line);margin-top:12px}
.kv>div{background:var(--panel);padding:10px 18px}
.kv dt{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.kv dd{margin:3px 0 0;font-weight:600;font-size:15px}
.rank{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.r-best{background:var(--good-bg);color:var(--good)}
.r-worst{background:var(--crit-bg);color:var(--crit)}
.empty{padding:40px 18px;color:var(--ink-3);text-align:center}

/* leitura rapida */
.insights{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.insights li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:10px;background:var(--panel-2)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:3px 7px;white-space:nowrap}
.t-good{background:var(--good-bg);color:var(--good)}
.t-warn{background:var(--warn-bg);color:var(--warn)}
.t-crit{background:var(--crit-bg);color:var(--crit)}
.t-info{background:var(--chip);color:var(--ink-2)}

/* graficos */
svg text{fill:var(--ink-3);font-family:var(--f-mono);font-size:10.5px}
.chartwrap{position:relative;width:100%}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line-2);box-shadow:var(--shadow);border-radius:10px;padding:8px 10px;font-size:12px;min-width:150px;z-index:5;transform:translate(-50%,-100%);white-space:nowrap}
.tip .tt{font-weight:700;margin-bottom:4px}
.tip .tr{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tip .tr span:first-child{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.heat{display:grid;gap:2px}
.heat .cell{height:22px;border-radius:3px;position:relative}
.heat .lab{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);display:flex;align-items:center}
.heat .cell:hover{outline:2px solid var(--ink);outline-offset:0;z-index:2}
.bar-row{display:grid;grid-template-columns:minmax(110px,160px) minmax(0,1fr);gap:10px;align-items:center;padding:5px 0}
.bars{display:flex;flex-direction:column;gap:3px}
.bar{height:9px;border-radius:0 4px 4px 0;min-width:2px}
.bar-lab{font-size:12.5px;font-weight:600}
.bar-lab small{display:block;font-weight:400;color:var(--ink-3);font-size:11px}
.clickable{cursor:pointer;border-radius:8px;padding-inline:6px;margin-inline:-6px}
.clickable:hover{background:var(--panel-2)}
.clickable[aria-pressed="true"]{background:var(--chip)}
.stack{display:flex;height:26px;border-radius:6px;overflow:hidden;gap:2px;background:var(--panel)}
.stack>div{height:100%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;min-width:0;overflow:hidden}

/* tabelas */
.tablewrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);text-align:left;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
th button{border:0;background:none;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr:hover td{background:var(--panel-2)}
.bdot{display:inline-flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px}

/* avaliacoes */
.revcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:14px}
@media (max-width:980px){.revcols{grid-template-columns:minmax(0,1fr)}}
.revcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.revhead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.rev{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.rev p{margin:0;font-size:13.5px;line-height:1.5;overflow-wrap:anywhere}
.rev mark{background:var(--warn-bg);color:inherit;border-radius:3px;padding:0 2px}
.revmeta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:11.5px;color:var(--ink-3)}
.minitag{font-size:10.5px;font-weight:600;background:var(--chip);color:var(--ink-2);border-radius:5px;padding:1px 6px}
.more{border:1px solid var(--line-2);background:var(--panel);border-radius:9px;height:36px;font-weight:600}

/* mapa */
.mapbox{background:var(--panel-2);border-radius:10px;border:1px solid var(--line)}
.mapbox svg text.city{font-family:var(--f-display);font-size:13px;font-weight:700;fill:var(--ink-3);letter-spacing:.2em}
.mapbox svg text.shop{font-family:var(--f-body);font-size:11.5px;font-weight:600;fill:var(--ink-2)}

/* analista */
.ask{display:flex;flex-direction:column;gap:10px}
textarea{width:100%;min-height:92px;resize:vertical;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);padding:12px;line-height:1.5}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{border:1px solid var(--line-2);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:12.5px;text-align:left}
.sugg button:hover{background:var(--panel-2)}
.primary{background:var(--chip-on);color:var(--chip-on-ink);border:0;border-radius:9px;height:38px;padding:0 18px;font-weight:700}
.primary:disabled{opacity:.5;cursor:default}
.ghost{background:none;border:1px solid var(--line-2);border-radius:9px;height:38px;padding:0 14px;font-weight:600}
.answer{font-size:14.5px;line-height:1.65;max-width:78ch}
.answer h4{font-family:var(--f-display);font-size:16px;margin:16px 0 6px}
.answer ul{padding-left:20px;margin:6px 0}
.answer p{margin:8px 0}
.thinking{display:inline-flex;align-items:center;gap:8px;color:var(--ink-3)}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:pulse 1s infinite ease-in-out}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.thinking i{animation:none;opacity:.7}}
.maxpk{display:inline-block;color:#fff;font-weight:700;border-radius:5px;padding:1px 6px}
.beta{display:inline-block;font-family:var(--f-body);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:5px;padding:2px 6px;background:var(--warn-bg);color:var(--warn);vertical-align:2px}
.info{position:relative;display:inline-flex}
.info>button{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink-3);background:var(--panel);color:var(--ink-2);font-size:11px;font-weight:800;line-height:1;padding:0;display:inline-flex;align-items:center;justify-content:center}
.info>button:hover,.info>button[aria-expanded="true"]{border-color:var(--ink);color:var(--ink)}
.pop{position:absolute;z-index:30;top:calc(100% + 8px);left:50%;transform:translateX(-50%);width:min(320px,80vw);background:var(--panel);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;font-size:12.5px;line-height:1.55;color:var(--ink-2);text-align:left;white-space:normal}
.pop b{color:var(--ink)}
.pop p{margin:0 0 6px}
.matrix td{vertical-align:top}
.mcell{display:grid;grid-template-rows:30px 6px auto;row-gap:7px;min-width:130px}
.mcell .v{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;white-space:nowrap;height:30px;overflow:hidden}
.mcell .top{display:inline-flex;align-items:center;gap:3px;color:#fff;font-weight:700;font-size:10.5px;border-radius:5px;padding:2px 6px;line-height:1.2}
.mcell .v b{font-family:var(--f-display);font-size:20px;letter-spacing:-.02em}
.mtrack{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.mtrack>div{height:100%;border-radius:0 3px 3px 0}
.evo{display:flex;flex-direction:column;gap:6px}
.evo-row{display:grid;grid-template-columns:136px minmax(0,1fr) 72px;gap:10px;align-items:center}
.evo-head{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:6px}
.evo-cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));text-align:center;gap:4px}
.evo-plot{position:relative;border-bottom:1px solid var(--line)}
.evo-plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.evo-pt{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap}
.evo-pt i{width:10px;height:10px;border-radius:50%;border:2px solid var(--panel);box-sizing:content-box}
.evo-pt b{font-size:11.5px;background:var(--panel);padding:0 3px;border-radius:3px}
.escopo{display:flex;gap:10px;align-items:flex-start;margin-top:8px;font-size:12.5px;color:var(--ink-2);max-width:110ch}
.nivel{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;margin-top:14px}
.foot{margin-top:28px;color:var(--ink-3);font-size:12px;max-width:90ch;line-height:1.6}
.callout{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 12px;background:var(--warn-bg);color:var(--ink);font-size:12.5px;margin-top:12px}
.callout b{color:var(--warn)}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="data.js"></script>
<script>
(function(){
const {useState,useMemo,useEffect,useRef,useCallback} = React;
const html = htm.bind(React.createElement);
const D = window.PAINEL;

// Cores reais das marcas (verticais/<id>.json), com os tons do tema escuro.
// Texto sobre a cor da marca: branco ou tinta escura, pelo contraste.
(function(){
  if(!D.cores) return;
  const lum = h => { const c=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)); return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]; };
  const tinta = h => (1.05/(lum(h)+0.05)) >= 4.5 ? "#FFFFFF" : "#0D131D";
  const bloco = cs => cs.map((c,i)=>`--b${i}:${c};--b${i}-soft:${c}24;--b${i}-ink:${tinta(c)};`).join("");
  const st = document.createElement("style");
  st.textContent = `:root{${bloco(D.cores.light)}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${bloco(D.cores.dark)}}}
:root[data-theme="dark"]{${bloco(D.cores.dark)}}`;
  document.head.appendChild(st);
})();

/* ------------------------------------------------------------ base */
// Marcas, temas e textos vem da vertical (verticais/<id>.json via gerar_dados.py)
const MARCAS = D.marcas || ["C&A","Renner","Riachuelo"];
const MI = Object.fromEntries(MARCAS.map((m,i)=>[m,i]));
const cor = m => `var(--b${MI[m]})`;
const soft = m => `var(--b${MI[m]}-soft)`;
const DIAS = D.dias;
const DIA_CURTO = {"domingo":"Dom","segunda-feira":"Seg","terca-feira":"Ter","quarta-feira":"Qua","quinta-feira":"Qui","sexta-feira":"Sex","sabado":"Sáb"};
const DIA_LONGO = {"domingo":"domingo","segunda-feira":"segunda","terca-feira":"terça","quarta-feira":"quarta","quinta-feira":"quinta","sexta-feira":"sexta","sabado":"sábado"};
const HORAS = Array.from({length:18},(_,i)=>i+6);

// Livro de codigos: codigos (TEMAS) agrupados em nets. Uma net marca a
// avaliacao que cita qualquer codigo dela.
const TEMAS = D.temas ? D.temas.map(t=>({id:t.id, nome:t.nome, net:t.net||"Temas", re:new RegExp(t.re,"i")})) : TEMAS_MODA.map(t=>({...t,net:"Temas"}));
const NETS = [...new Set(TEMAS.map(t=>t.net))].map(n=>{
  const cods = TEMAS.filter(t=>t.net===n);
  return {id:"net-"+n.normalize("NFD").replace(/[^\w]+/g,"-").toLowerCase(), nome:n, net:n, ehNet:true, codigos:cods.map(c=>c.id),
    re:new RegExp(cods.map(c=>"(?:"+c.re.source+")").join("|"),"i")};
});
const TODOS = [...NETS, ...TEMAS];
const TEMA_POR_ID = Object.fromEntries(TODOS.map(t=>[t.id,t]));

const LOJAS = D.lojas;
const ORDEM_TXT = D.ordenacao === "mais recentes" ? "as mais recentes de cada loja" : "na ordem de relevância do Google";
const LOJA = Object.fromEntries(LOJAS.map(l=>[l.id,l]));
const REVS = D.avaliacoes.map((r,i)=>({...r, i, marca:LOJA[r.s].marca, temas:r.t?TODOS.filter(t=>t.re.test(r.t)).map(t=>t.id):[]}));
const SHOPPINGS = [...new Set(LOJAS.map(l=>l.shopping))].sort((a,b)=>{
  const na = new Set(LOJAS.filter(l=>l.shopping===a).map(l=>l.marca)).size;
  const nb = new Set(LOJAS.filter(l=>l.shopping===b).map(l=>l.marca)).size;
  return nb-na || a.localeCompare(b);
});
const notaLoja = l => { const t=[1,2,3,4,5].reduce((a,k)=>a+(l.dist?.[k]||0),0); return t ? [1,2,3,4,5].reduce((a,k)=>a+k*(l.dist?.[k]||0),0)/t : l.nota; };
const repLoja = (l, amostra) => {
  if(amostra){ const rs=amostra.filter(r=>r.s===l.id), n=rs.length;
    return {nota:n?rs.reduce((a,r)=>a+r.e,0)/n:null, total:n, neg:n?rs.filter(r=>r.e<=2).length/n*100:null}; }
  const dt=[1,2,3,4,5].reduce((a,k)=>a+(l.dist?.[k]||0),0);
  return {nota:notaLoja(l), total:l.total, neg:dt?((l.dist[1]||0)+(l.dist[2]||0))/dt*100:null};
};
const marcasNoShopping = s => new Set(LOJAS.filter(l=>l.shopping===s).map(l=>l.marca));

const PERIODOS = [
  {id:"todos", nome:"Todos", ok:()=>true},
  {id:"12", nome:"Último ano", ok:m=>m!=null&&m<=12.5},
  {id:"36", nome:"1 a 3 anos", ok:m=>m!=null&&m>12.5&&m<=36.5},
  {id:"mais", nome:"Mais de 3 anos", ok:m=>m!=null&&m>36.5},
];
const idadeFaixa = m => m==null?"?": m<=12.5?"Último ano": m<=24.5?"1 a 2 anos": m<=36.5?"2 a 3 anos":"Mais de 3 anos";
// Com periodo_mensal_desde, a evolucao vira mes a mes (ex.: janeiro ate o mes da coleta)
const MESES_ABR = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const MENSAL = (()=>{
  if(!D.periodo_mensal_desde) return null;
  const [a0,m0] = D.periodo_mensal_desde.split("-").map(Number);
  const [a1,m1] = D.coleta.slice(0,7).split("-").map(Number);
  const out=[]; for(let a=a0,m=m0; a<a1||(a===a1&&m<=m1); m===12?(a++,m=1):m++) out.push(`${a}-${String(m).padStart(2,"0")}`);
  return out;
})();
// do mais antigo para o mais recente, para ler a evolucao da esquerda para a direita
const FAIXAS = MENSAL ? MENSAL.map(k=>MESES_ABR[+k.slice(5)-1]+"/"+k.slice(2,4)) : ["Mais de 3 anos","2 a 3 anos","1 a 2 anos","Último ano"];
const faixaDe = r => MENSAL ? (MENSAL.includes(r.a) ? FAIXAS[MENSAL.indexOf(r.a)] : "?") : idadeFaixa(r.m);

/* ------------------------------------------------------------ agregacoes */
function curvaMarca(lojas, marca, dia){
  // media das lojas abertas em cada hora; exige metade das lojas com dado
  const ls = lojas.filter(l=>l.marca===marca);
  const dias = dia==="todos" ? DIAS : [dia];
  const out = {};
  const nLojas = {};
  for(const d of dias){
    const comDado = ls.filter(l=>Object.values(l.pico[d]||{}).some(v=>v>0));
    const minimo = Math.max(1, Math.ceil(comDado.length/2));
    for(const h of HORAS){
      const vs = comDado.map(l=>l.pico[d][h]).filter(v=>v>0);
      if(vs.length>=minimo){ (out[h] ||= []).push(vs.reduce((a,b)=>a+b,0)/vs.length); }
    }
    nLojas[d]=comDado.length;
  }
  const curva = {};
  for(const h in out){ curva[h] = out[h].reduce((a,b)=>a+b,0)/out[h].length; }
  return {curva, lojas: dia==="todos" ? Math.max(0,...Object.values(nLojas)) : nLojas[dia]};
}
function resumoCurva(c){
  const hs = Object.keys(c).map(Number);
  if(!hs.length) return null;
  const ord = [...hs].sort((a,b)=>c[b]-c[a]);
  return {pico:ord[0], valor:c[ord[0]], top:ord.slice(0,3), vazia:[...hs].sort((a,b)=>c[a]-c[b])[0], media:hs.reduce((s,h)=>s+c[h],0)/hs.length};
}
function picoSemana(lojas, marca){
  let best=null;
  for(const d of DIAS){ const r=resumoCurva(curvaMarca(lojas,marca,d).curva); if(r && (!best||r.valor>best.valor)) best={...r,dia:d}; }
  return best;
}
// Sem filtro de avaliacao: totais do Google. Com filtro (periodo, estrelas,
// tema ou busca): tudo sai da amostra filtrada, porque o total do Google nao
// tem data nem nota individual.
function reputacao(lojas, marca, amostra){
  const nLojas = lojas.filter(l=>l.marca===marca).length;
  if(amostra){
    const rs = amostra.filter(r=>r.marca===marca);
    const dist = {5:0,4:0,3:0,2:0,1:0}; rs.forEach(r=>{ dist[r.e]++; });
    const dtot = rs.length;
    const porLoja = lojas.filter(l=>l.marca===marca).map(l=>rs.filter(r=>r.s===l.id)).filter(x=>x.length);
    return {amostra:true, lojas:nLojas, dist, dtot, tot:dtot,
      nota: dtot ? rs.reduce((a,r)=>a+r.e,0)/dtot : null,
      simples: porLoja.length ? porLoja.reduce((a,x)=>a+x.reduce((b,r)=>b+r.e,0)/x.length,0)/porLoja.length : null,
      neg: dtot ? (dist[1]+dist[2])/dtot*100 : null};
  }
  const ls = lojas.filter(l=>l.marca===marca && l.total);
  const tot = ls.reduce((s,l)=>s+l.total,0);
  const dist = {5:0,4:0,3:0,2:0,1:0};
  ls.forEach(l=>{ for(const k in l.dist) dist[k]+=l.dist[k]; });
  const dtot = Object.values(dist).reduce((a,b)=>a+b,0);
  // Media de todas as avaliacoes, pela contagem de estrelas: evita o
  // arredondamento de uma casa que o Google aplica na nota de cada loja
  const nota = dtot ? [1,2,3,4,5].reduce((s,k)=>s+k*dist[k],0)/dtot : null;
  const simples = ls.length ? ls.reduce((s,l)=>s+l.nota,0)/ls.length : null;
  const neg = dtot ? (dist[1]+dist[2])/dtot*100 : null;
  return {amostra:false, nota, simples, tot, dist, dtot, neg, lojas: nLojas};
}
function revStats(revs){
  const txt = revs.filter(r=>r.t);
  const neg = revs.filter(r=>r.e<=2);
  return {
    n:revs.length, comTexto:txt.length,
    media: revs.length ? revs.reduce((s,r)=>s+r.e,0)/revs.length : null,
    negPct: revs.length ? neg.length/revs.length*100 : null,
    resp: revs.length ? revs.filter(r=>r.r).length/revs.length*100 : null,
    respNeg: neg.length ? neg.filter(r=>r.r).length/neg.length*100 : null,
    temas: Object.fromEntries(TODOS.map(t=>{
      const com = txt.filter(r=>r.temas.includes(t.id));
      return [t.id,{n:com.length, pct: txt.length? com.length/txt.length*100 : 0,
        neg: com.length? com.filter(r=>r.e<=2).length/com.length*100 : null}];
    })),
  };
}

const escala = vs => { const m = Math.max(0, ...vs.filter(v=>v!=null&&isFinite(v))); return Math.min(100, Math.max(20, Math.ceil(m*1.15/10)*10)); };

function Stars({v,size=13}){
  const out=[];
  for(let i=1;i<=5;i++){
    const f = Math.max(0,Math.min(1,(v||0)-(i-1)));
    out.push(html`<svg key=${i} width=${size} height=${size} viewBox="0 0 20 20" aria-hidden="true">
      <defs><linearGradient id=${"sg"+i+"-"+Math.round(f*100)}><stop offset=${f} stop-color="var(--warn)"/><stop offset=${f} stop-color="var(--line-2)"/></linearGradient></defs>
      <path d="M10 1.5l2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L1.3 7.8l6.1-.7z" fill=${`url(#sg${i}-${Math.round(f*100)})`}/></svg>`);
  }
  return html`<span class="starrow" role="img" aria-label=${fmt(v,1)+" de 5 estrelas"}>${out}</span>`;
}

function InfoTip({label,children}){
  const [open,setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(()=>{ if(!open) return; const f=e=>{ if(ref.current&&!ref.current.contains(e.target)) setOpen(false); }; const k=e=>{ if(e.key==="Escape") setOpen(false); };
    document.addEventListener("mousedown",f); document.addEventListener("keydown",k); return ()=>{document.removeEventListener("mousedown",f);document.removeEventListener("keydown",k);}; },[open]);
  return html`<span class="info" ref=${ref}>
    <button type="button" aria-label=${label} aria-expanded=${open} onClick=${()=>setOpen(!open)}>!</button>
    ${open && html`<div class="pop" role="dialog" aria-label=${label}>${children}</div>`}
  </span>`;
}

/* grafico de linhas com cruz e dica */
function LineChart({series,height=260,yMax=100,xs=HORAS,fmtX=hh,fmtV=v=>pct(v),tipTitle=h=>`${hh(h)} às ${hh(h+1)}`,ticks=[0,25,50,75,100],yMin=0,every=3,label="Movimento por hora, uma linha por marca"}){
  const ref = useRef(null);
  const [w,setW] = useState(700);
  const [hover,setHover] = useState(null);
  useEffect(()=>{ const ro=new ResizeObserver(e=>setW(e[0].contentRect.width)); ro.observe(ref.current); return ()=>ro.disconnect(); },[]);
  const m = {l:34,r:14,t:12,b:26};
  const iw = Math.max(10,w-m.l-m.r), ih = height-m.t-m.b;
  const x = v => m.l + (xs.indexOf(v))/(xs.length-1)*iw;
  const y = v => m.t + ih - (v-yMin)/(yMax-yMin)*ih;
  const path = pts => {
    let d="", pen=false;
    xs.forEach(h=>{ const v=pts[h]; if(v==null){pen=false;return;} d += (pen?"L":"M")+x(h).toFixed(1)+","+y(v).toFixed(1); pen=true; });
    return d;
  };
  const onMove = e => {
    const r = ref.current.getBoundingClientRect();
    const px = e.clientX - r.left;
    const i = Math.round((px-m.l)/iw*(xs.length-1));
    setHover(i>=0&&i<xs.length ? xs[i] : null);
  };
  return html`<div class="chartwrap" ref=${ref} onMouseMove=${onMove} onMouseLeave=${()=>setHover(null)}>
    <svg width=${w} height=${height} role="img" aria-label=${label}>
      ${ticks.map(t=>html`<g key=${t}><line x1=${m.l} x2=${m.l+iw} y1=${y(t)} y2=${y(t)} stroke="var(--line)" stroke-dasharray=${t?"2 4":""}/><text x=${m.l-8} y=${y(t)+3.5} text-anchor="end">${String(t).replace(".",",")}</text></g>`)}
      ${xs.filter((h,i)=>i%every===0).map((h,i,a)=>html`<text key=${h} x=${x(h)} y=${height-8} text-anchor=${a.length>1&&i===a.length-1&&every===1?"end":a.length>1&&i===0&&every===1?"start":"middle"}>${fmtX(h)}</text>`)}
      ${series.map(s=>html`<g key=${s.m}>
        <path d=${path(s.pts)+ (Object.keys(s.pts).length? "":"")} fill="none" stroke=${cor(s.m)} stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>
        ${(()=>{const r=resumoCurva(s.pts); if(!r) return null; return html`<g>
          <circle cx=${x(r.pico)} cy=${y(r.valor)} r="5" fill=${cor(s.m)} stroke="var(--panel)" stroke-width="2"/>
        </g>`})()}
      </g>`)}
      ${hover!=null && html`<g>
        <line x1=${x(hover)} x2=${x(hover)} y1=${m.t} y2=${m.t+ih} stroke="var(--ink-3)" stroke-width="1"/>
        ${series.map(s=>s.pts[hover]!=null && html`<circle key=${s.m} cx=${x(hover)} cy=${y(s.pts[hover])} r="4.5" fill=${cor(s.m)} stroke="var(--panel)" stroke-width="2"/>`)}
      </g>`}
    </svg>
    ${hover!=null && html`<div class="tip" style=${{left:Math.min(Math.max(x(hover),90),w-90), top:m.t+4}}>
      <div class="tt">${tipTitle(hover)}</div>
      ${[...series].sort((a,b)=>(b.pts[hover]??-1)-(a.pts[hover]??-1)).map(s=>html`<div class="tr" key=${s.m}><span><${Swatch} m=${s.m} size=${9}/>${s.m}</span><b class="num">${s.pts[hover]!=null?fmtV(s.pts[hover]):"sem dado"}</b></div>`)}
    </div>`}
  </div>`;
}

/* mapa de calor dia x hora, uma marca */
function Heat({lojas,marca,diaSel,onDia}){
  const [tip,setTip] = useState(null);
  const rows = DIAS.map(d=>({d, c:curvaMarca(lojas,marca,d).curva}));
  const has = rows.some(r=>Object.keys(r.c).length);
  if(!has) return html`<div class="empty">Sem dado de movimento neste recorte</div>`;
  const shade = v => v==null ? "var(--heat-0)" : `color-mix(in oklab, ${cor(marca)} ${Math.round(12+v*0.88)}%, var(--heat-0))`;
  return html`<div style=${{position:"relative"}} onMouseLeave=${()=>setTip(null)}>
    <div class="heat" style=${{gridTemplateColumns:`34px repeat(${HORAS.length},minmax(0,1fr))`}}>
      ${rows.map(r=>html`<${React.Fragment} key=${r.d}>
        <button type="button" class="lab clickable" style=${{border:0,background:diaSel===r.d?"var(--chip)":"none",fontWeight:diaSel===r.d?700:400}} onClick=${()=>onDia(diaSel===r.d?"todos":r.d)} aria-pressed=${diaSel===r.d}>${DIA_CURTO[r.d]}</button>
        ${HORAS.map(h=>html`<div key=${h} class="cell" style=${{background:shade(r.c[h]), opacity: diaSel!=="todos"&&diaSel!==r.d?.35:1}}
            onMouseEnter=${e=>{const b=e.currentTarget.getBoundingClientRect(), p=e.currentTarget.parentElement.getBoundingClientRect(); setTip({x:b.left-p.left+b.width/2,y:b.top-p.top,d:r.d,h,v:r.c[h]});}}></div>`)}
      </${React.Fragment}>`)}
      <div></div>
      ${HORAS.map(h=>html`<div key=${h} class="lab" style=${{justifyContent:"center"}}>${h%3===0?String(h).padStart(2,"0"):""}</div>`)}
    </div>
    ${tip && html`<div class="tip" style=${{left:tip.x, top:tip.y-4, minWidth:0}}>
      <div class="tt">${DIA_LONGO[tip.d]}, ${hh(tip.h)}</div>
      <div class="tr"><span><${Swatch} m=${marca} size=${9}/>${marca}</span><b class="num">${tip.v!=null?pct(tip.v):"fechada"}</b></div>
    </div>`}
  </div>`;
}

function Evolucao({idade}){
  const todos = idade.flatMap(x=>Object.values(x.pts));
  if(!todos.length) return html`<div class="empty">Sem avaliações suficientes neste recorte</div>`;
  const lo = Math.min(...todos), hi = Math.max(...todos);
  const pad = Math.max(0.15,(hi-lo)*0.15);
  const y0 = lo-pad, y1 = hi+pad;
  const H = 64, n = FAIXAS.length;
  const cx = i => (i+0.5)/n*100;
  const cy = v => 14 + (1-(v-y0)/(y1-y0))*(H-30);
  return html`<div class="evo">
    <div class="evo-row evo-head">
      <span></span>
      <div class="evo-cols" style=${{gridTemplateColumns:`repeat(${FAIXAS.length},minmax(0,1fr))`}}>${FAIXAS.map(f=>html`<span key=${f}>${f}</span>`)}</div>
      <span style=${{textAlign:"right"}}>Variação</span>
    </div>
    ${idade.map(x=>{
      const idx = Object.keys(x.pts).map(Number).sort((a,b)=>a-b);
      const pts = idx.map(i=>[cx(i),cy(x.pts[i])]);
      const primeiro = idx[0], ultimo = idx[idx.length-1];
      // Compara o periodo mais recente com dado contra o mais antigo com dado
      const delta = idx.length>1 ? x.pts[ultimo]-x.pts[primeiro] : null;
      const tom = delta==null?"t-info":delta<=-0.15?"t-crit":delta>=0.15?"t-good":"t-info";
      return html`<div class="evo-row" key=${x.m}>
        <${Brand} m=${x.m}/>
        <div class="evo-plot" style=${{height:H}}>
          <svg viewBox=${`0 0 100 ${H}`} preserveAspectRatio="none" aria-hidden="true">
            ${FAIXAS.map((f,i)=>html`<line key=${f} x1=${cx(i)} x2=${cx(i)} y1="4" y2=${H-4} stroke="var(--line)" vector-effect="non-scaling-stroke"/>`)}
            ${pts.length>1 && html`<polyline points=${pts.map(p=>p.join(",")).join(" ")} fill="none" stroke=${cor(x.m)} stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`}
          </svg>
          ${FAIXAS.map((f,i)=>{
            const v = x.pts[i];
            if(v==null) return html`<div key=${f} class="evo-pt" style=${{left:cx(i)+"%",top:H/2-8}} title=${x.n[i]?`${x.n[i]} avaliações, poucas para uma média`:"sem avaliações"}><span class="note">${x.n[i]?"("+x.n[i]+")":"–"}</span></div>`;
            return html`<div key=${f} class="evo-pt" style=${{left:cx(i)+"%",top:cy(v)-5}} title=${`${x.m}, ${f}: ${fmt(v,2)} em ${x.n[i]} avaliações`}>
              <i class=${"sh"+MI[x.m]} style=${{background:cor(x.m),borderRadius:MI[x.m]===0?"50%":MI[x.m]===1?"2px":0}}></i>
              <b class="num">${fmt(v,2)}</b>
            </div>`;
          })}
        </div>
        <div style=${{textAlign:"right"}}>${delta==null?html`<span class="note">–</span>`:html`<span class=${"tag "+tom} style=${{fontSize:12,letterSpacing:0}}>${delta>0?"▲":delta<0?"▼":"●"} ${fmt(Math.abs(delta),2)}</span>`}</div>
      </div>`;
    })}
    <p class="note" style=${{margin:"6px 0 0"}}>Amostra por período: ${idade.map(x=>`${x.m} ${FAIXAS.map((f,i)=>x.n[i]).join(" · ")}`).join("  |  ")}</p>
  </div>`;
}

/* ------------------------------------------------------------ abas */
function Panorama({lojas,revs,revsTemas,revsNeg,amostra,dia,setTab,setTema}){
  const dados = MARCAS.map(m=>{
    const rep = reputacao(lojas,m,amostra);
    const st = revStats(revs.filter(r=>r.marca===m));
    const stT = revStats(revsTemas.filter(r=>r.marca===m));
    const pk = dia==="todos" ? picoSemana(lojas,m) : (()=>{const r=resumoCurva(curvaMarca(lojas,m,dia).curva); return r&&{...r,dia};})();
    const stNeg = revStats(revsNeg.filter(r=>r.marca===m));
    const piorTema = TEMAS.map(t=>({t,neg:stNeg.temas[t.id].neg,n:stNeg.temas[t.id].n})).filter(x=>x.n>=10&&x.neg!=null).sort((a,b)=>b.neg-a.neg)[0];
    const stN = stNeg;
    return {m,rep,st,stT,stN,pk,piorTema};
  });
  const melhor = (k,dir=1)=>{
    const vs=dados.filter(d=>d.rep.lojas&&k(d)!=null); if(vs.length<2) return {};
    const s=[...vs].sort((a,b)=>dir*(k(b)-k(a)));
    const topo=k(s[0]), fundo=k(s[s.length-1]);
    if(Math.abs(topo-fundo)<0.005) return {};  // empate: nenhum selo
    const unico = v => vs.filter(d=>Math.abs(k(d)-v)<0.005).length===1;
    return {best:unico(topo)?s[0].m:null, worst:unico(fundo)?s[s.length-1].m:null};
  };
  const rkNota = melhor(d=>d.rep.nota), rkNeg = melhor(d=>d.rep.neg,-1), rkResp = melhor(d=>d.st.resp);

  const insights = useMemo(()=>{
    const out=[];
    const com = dados.filter(d=>d.rep.nota!=null);
    if(com.length>=2){
      const s=[...com].sort((a,b)=>b.rep.neg-a.rep.neg);
      out.push({k:"t-crit",t:"Atenção",x:`${s[0].m} concentra a maior parcela de notas 1 e 2 ${amostra?"na amostra filtrada":"no Google"} (${pct(s[0].rep.neg,1)}), contra ${pct(s[s.length-1].rep.neg,1)} de ${s[s.length-1].m}.`});
    }
    const dt = D.destaque_tema && TEMA_POR_ID[D.destaque_tema] ? D.destaque_tema : null;
    const cart = dt ? dados.map(d=>({m:d.m,v:d.stT.temas[dt].n,p:d.stT.temas[dt].pct})).sort((a,b)=>b.v-a.v) : [];
    if(cart.length && cart[0].v>=5) out.push({k:"t-warn",t:"Tema",x:`${TEMA_POR_ID[dt].nome} aparece em ${fmt(cart[0].v)} avaliações da ${cart[0].m} (${pct(cart[0].p,1)} das que têm texto)${D.destaque_texto?", "+D.destaque_texto:""}.`,tema:dt});
    const fila = TEMA_POR_ID.fila ? dados.map(d=>({m:d.m,neg:d.stN.temas.fila.neg,n:d.stN.temas.fila.n})).filter(x=>x.n>=10).sort((a,b)=>b.neg-a.neg) : [];
    if(fila.length) out.push({k:"t-warn",t:"Operação",x:`Quando falam de fila e caixa, ${pct(fila[0].neg)} das avaliações da ${fila[0].m} são negativas.`,tema:"fila"});
    const pk = dados.filter(d=>d.pk).map(d=>`${d.m} ${DIA_LONGO[d.pk.dia]} às ${hh(d.pk.pico)}`);
    if(pk.length) out.push({k:"t-info",t:"Movimento",x:`${dia==="todos"?"Pico da semana":"Pico de "+DIA_LONGO[dia]}: ${pk.join(", ")}.`,tab:"movimento"});
    const resp = dados.filter(d=>d.st.respNeg!=null).sort((a,b)=>b.st.respNeg-a.st.respNeg);
    if(resp.length>=2) out.push({k:"t-good",t:"Relacionamento",x:`${resp[0].m} responde ${pct(resp[0].st.respNeg)} das avaliações negativas da amostra. ${resp[resp.length-1].m} responde ${pct(resp[resp.length-1].st.respNeg)}.`});
    return out;
  },[lojas,revs,revsTemas,revsNeg,amostra,dia]);

  return html`<div>
    <div class="grid g3">
      ${dados.map(d=>html`<article class="brandcard" key=${d.m} aria-label=${"Resumo "+d.m}>
        <div class="bc-head" style=${{boxShadow:`inset 0 3px 0 ${cor(d.m)}`}}>
          <div class="bc-name"><${Swatch} m=${d.m} size=${14}/>${d.m}</div>
          <div class="bc-stores">${d.rep.lojas} ${d.rep.lojas===1?"loja":"lojas"}</div>
        </div>
        ${d.rep.lojas===0 ? html`<div class="empty">Sem loja neste recorte</div>` : html`
        <div class="bc-hero">
          <div class="bc-big num">${fmt(d.rep.nota,2)}</div>
          <div class="bc-stars"><${Stars} v=${d.rep.nota} size=${15}/><span class="note" style=${{display:"inline-flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>${d.rep.amostra?"nota média da amostra filtrada":"nota média ponderada"} <${InfoTip} label="Como a nota é calculada">
            ${d.rep.amostra ? html`<p><b>Nota da amostra filtrada</b></p>
            <p>Com filtro de período, estrelas, tema ou busca ligado, a nota é a média das avaliações lidas que passam no filtro: <b class="num">${fmt(d.rep.dtot)}</b> avaliações da ${d.m}.</p>
            <p>O total do Google não tem data nem nota individual, por isso não pode ser filtrado. Limpe esses filtros para voltar à nota ponderada de todas as avaliações do Google.</p>
            <p>Média simples das lojas na amostra: <b class="num">${fmt(d.rep.simples,2)}</b>.</p>` : html`
            <p><b>Nota média ponderada</b></p>
            <p>É a média de todas as avaliações do Google das lojas da ${d.m} no recorte, calculada pela contagem de estrelas (quantas de 5★, 4★, 3★, 2★ e 1★).</p>
            <p>Cada avaliação pesa igual. Por isso uma loja com 3.800 avaliações pesa mais que uma com 24, e a nota reflete o que a maioria dos clientes disse.</p>
            <p>Não usamos a nota arredondada que o Google mostra em cada loja (por exemplo 4,3), para não esconder diferenças pequenas entre as marcas.</p>
            <p>Base: <b class="num">${fmt(d.rep.dtot)}</b> avaliações. Média simples das lojas, sem peso: <b class="num">${fmt(d.rep.simples,2)}</b>.</p>`}
          </${InfoTip}>${rkNota.best===d.m?html`<span class="rank r-best">melhor</span>`:rkNota.worst===d.m?html`<span class="rank r-worst">menor</span>`:null}</span></div>
        </div>
        <dl class="kv">
          <div><dt>${d.rep.amostra?"Avaliações no filtro":"Avaliações no Google"}</dt><dd class="num">${fmt(d.rep.tot)}</dd></div>
          <div><dt>Notas 1 e 2</dt><dd class="num">${pct(d.rep.neg,1)}${rkNeg.best===d.m?html`<span class="rank r-best">menor</span>`:rkNeg.worst===d.m?html`<span class="rank r-worst">maior</span>`:null}</dd></div>
          <div><dt>${dia==="todos"?"Pico da semana":"Pico do dia"}</dt><dd>${d.pk?html`<span>${DIA_CURTO[d.pk.dia]} ${hh(d.pk.pico)}</span> <span class="num note">${pct(d.pk.valor)}</span>`:"–"}</dd></div>
          <div><dt>Responde a loja</dt><dd class="num">${pct(d.st.resp)}${rkResp.best===d.m?html`<span class="rank r-best">mais</span>`:null}</dd></div>
          <div><dt>${d.rep.amostra?"Total no Google":"Avaliações lidas"}</dt><dd class="num">${fmt(d.rep.amostra?reputacao(lojas,d.m).tot:d.st.n)}</dd></div>
          <div><dt>Tema mais crítico</dt><dd>${d.piorTema?html`<button class="linkbtn" style=${{padding:0,fontSize:14,fontWeight:600,color:"var(--ink)"}} onClick=${()=>{setTema(d.piorTema.t.id);setTab("voz");}}>${d.piorTema.t.nome}</button> <span class="num note">${pct(d.piorTema.neg)} neg.</span>`:"–"}</dd></div>
        </dl>`}
      </article>`)}
    </div>

    <div class="grid g21">
      <section class="panel">
        <div class="ph"><div><h2>${dia==="todos"?"Movimento médio da semana":"Movimento de "+DIA_LONGO[dia]}</h2><p class="sub">Percentual de lotação por hora no Google, média das lojas abertas. O ponto marca o pico de cada marca.</p></div>
          <button class="linkbtn" onClick=${()=>setTab("movimento")}>Abrir movimento</button></div>
        <${LineChart} series=${MARCAS.map(m=>({m,pts:curvaMarca(lojas,m,dia).curva}))}/>
      </section>
      <section class="panel">
        <div class="ph"><div><h2>Leitura rápida</h2><p class="sub">Gerada a partir do recorte atual.</p></div></div>
        <ul class="insights">
          ${insights.map((it,i)=>html`<li key=${i}><span class=${"tag "+it.k}>${it.t}</span><span>${it.x}${it.tema&&html` <button class="linkbtn" onClick=${()=>{setTema(it.tema);setTab("voz");}}>ver avaliações</button>`}</span></li>`)}
        </ul>
      </section>
    </div>

    <section class="panel" style=${{marginTop:16}}>
      <div class="ph"><div><h2>Do que os clientes falam</h2><p class="sub">Parcela das avaliações com texto que citam cada net (grupo de códigos). Mostra todos os temas mesmo com filtro de tema ligado. Clique num tema para ler as avaliações.</p></div></div>
      <div class="grid g2" style=${{marginTop:0}}>
        <${GroupBars} rows=${NETS.slice(0,Math.ceil(NETS.length/2)).map(t=>({id:t.id,nome:t.nome,sub:TEMAS.filter(c=>c.net===t.net).length+" códigos",v:Object.fromEntries(dados.map(d=>[d.m,d.rep.lojas?d.stT.temas[t.id].pct:null]))}))} max=${escala(dados.flatMap(d=>NETS.map(t=>d.stT.temas[t.id].pct)))} onPick=${id=>{setTema(id);setTab("voz");}}/>
        <${GroupBars} rows=${NETS.slice(Math.ceil(NETS.length/2)).map(t=>({id:t.id,nome:t.nome,sub:TEMAS.filter(c=>c.net===t.net).length+" códigos",v:Object.fromEntries(dados.map(d=>[d.m,d.rep.lojas?d.stT.temas[t.id].pct:null]))}))} max=${escala(dados.flatMap(d=>NETS.map(t=>d.stT.temas[t.id].pct)))} onPick=${id=>{setTema(id);setTab("voz");}}/>
      </div>
    </section>
  </div>`;
}

function Movimento({lojas,dia,setDia}){
  const tabela = DIAS.map(d=>({d, r:Object.fromEntries(MARCAS.map(m=>[m,resumoCurva(curvaMarca(lojas,m,d).curva)]))}));
  const semana = Object.fromEntries(MARCAS.map(m=>[m,picoSemana(lojas,m)]));
  return html`<div>
    <section class="panel" style=${{marginTop:14}}>
      <div class="ph">
        <div><h2>${dia==="todos"?"Curva média da semana":"Curva de "+DIA_LONGO[dia]}</h2><p class="sub">Passe o mouse para comparar as três marcas na mesma hora. Horas com menos da metade das lojas abertas ficam de fora da média.</p></div>
        <div class="legend">${MARCAS.map(m=>html`<span class="lg" key=${m}><${Swatch} m=${m}/>${m}<span class="num note">${curvaMarca(lojas,m,dia).lojas||0} lojas</span></span>`)}</div>
      </div>
      <${LineChart} series=${MARCAS.map(m=>({m,pts:curvaMarca(lojas,m,dia).curva}))} height=${300}/>
    </section>

    <div class="grid g3">
      ${MARCAS.map(m=>html`<section class="panel" key=${m}>
        <div class="ph"><div><h2 style=${{display:"flex",alignItems:"center",gap:8}}><${Swatch} m=${m}/>${m}</h2><p class="sub">Dia × hora. Clique no dia para filtrar.</p></div>
          ${semana[m] && html`<div style=${{textAlign:"right"}}><div class="flabel">Pico da semana</div><div style=${{fontWeight:700}}>${DIA_CURTO[semana[m].dia]} ${hh(semana[m].pico)} <span class="num note">${pct(semana[m].valor)}</span></div></div>`}
        </div>
        <${Heat} lojas=${lojas} marca=${m} diaSel=${dia} onDia=${setDia}/>
      </section>`)}
    </div>

    <section class="panel" style=${{marginTop:16}}>
      <div class="ph"><div><h2>Horas mais cheias e pico de cada dia</h2><p class="sub">Para cada marca: a hora de pico com o percentual de lotação, as três horas mais cheias e a hora mais vazia enquanto a loja está aberta.</p></div></div>
      <div class="tablewrap"><table>
        <thead><tr><th>Dia</th>${MARCAS.map(m=>html`<th key=${m} colSpan="3"><${Brand} m=${m}/></th>`)}</tr>
          <tr><th></th>${MARCAS.map(m=>html`<${React.Fragment} key=${m}><th>Pico</th><th>3 mais cheias</th><th>Mais vazia</th></${React.Fragment}>`)}</tr></thead>
        <tbody>${tabela.map(row=>{
          const vals = MARCAS.map(m=>row.r[m]?.valor??-1); const mx=Math.max(...vals);
          return html`<tr key=${row.d} style=${{background: dia===row.d?"var(--panel-2)":null}}>
            <td><button class="linkbtn" style=${{padding:0,fontSize:13,fontWeight:700,color:"var(--ink)",textDecoration:dia===row.d?"underline":"none"}} onClick=${()=>setDia(dia===row.d?"todos":row.d)}>${DIA_LONGO[row.d]}</button></td>
            ${MARCAS.map(m=>{const r=row.r[m]; return html`<${React.Fragment} key=${m}>
              <td class="num" style=${{whiteSpace:"nowrap"}}>${r?html`<b>${hh(r.pico)}</b> ${r.valor===mx?html`<span class="maxpk" style=${{background:cor(m),color:`var(--b${MI[m]}-ink,#fff)`}} title="Maior pico do dia entre as marcas">${pct(r.valor)}</span>`:html`<span style=${{color:"var(--ink-2)"}}>${pct(r.valor)}</span>`}`:html`<span class="note">fechada</span>`}</td>
              <td class="num note" style=${{whiteSpace:"nowrap"}}>${r?r.top.map(hh).join(" · "):""}</td>
              <td class="num note">${r?hh(r.vazia):""}</td>
            </${React.Fragment}>`;})}
          </tr>`;})}</tbody>
      </table></div>
      <p class="note" style=${{marginTop:8,display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>O percentual com fundo na cor da marca mostra quem tem o maior pico do dia entre as três. Exemplo: <span class="maxpk" style=${{background:cor(MARCAS[0]),color:"var(--b0-ink,#fff)"}}>80%</span> seria a ${MARCAS[0]} liderando aquele dia.</p>
    </section>

    <section class="panel" style=${{marginTop:16}}>
      <div class="ph"><div><h2>Pico por loja</h2><p class="sub">${dia==="todos"?"Pico da semana de cada loja.":"Pico de "+DIA_LONGO[dia]+" em cada loja."} Lojas do mesmo local ficam lado a lado.</p></div></div>
      <div class="tablewrap"><table>
        <thead><tr><th>Local</th><th>Marca</th><th class="r">Pico</th><th>Horário</th><th>3 mais cheias</th><th class="r">Média aberta</th></tr></thead>
        <tbody>${[...lojas].sort((a,b)=>a.shopping.localeCompare(b.shopping)||MI[a.marca]-MI[b.marca]).map(l=>{
          const dias = dia==="todos"?DIAS:[dia];
          let best=null;
          dias.forEach(d=>{const hs=Object.entries(l.pico[d]||{}).filter(([h,v])=>v>0); if(!hs.length) return; const ord=hs.sort((a,b)=>b[1]-a[1]); if(!best||ord[0][1]>best.v) best={d,h:+ord[0][0],v:ord[0][1],top:ord.slice(0,3).map(x=>+x[0]),media:hs.reduce((s,x)=>s+x[1],0)/hs.length};});
          return html`<tr key=${l.id}><td>${l.shopping}</td><td><${Brand} m=${l.marca}/></td>
            <td class="r num">${best?html`<b>${pct(best.v)}</b>`:html`<span class="note">sem dado</span>`}</td>
            <td>${best?`${DIA_LONGO[best.d]}, ${hh(best.h)}`:""}</td>
            <td class="num note">${best?best.top.map(hh).join(" · "):""}</td>
            <td class="r num">${best?pct(best.media):""}</td></tr>`;})}</tbody>
      </table></div>
    </section>
  </div>`;
}

function Reputacao({lojas,revs,revsNeg,amostra,estrelas,setEstrelas}){
  const reps = MARCAS.map(m=>({m,...reputacao(lojas,m,amostra)}));
  // Nota por periodo ignora o filtro de estrelas, que deixaria a media constante
  const idade = MARCAS.map(m=>{
    const rs = revsNeg.filter(r=>r.marca===m);
    const pts = {};
    FAIXAS.forEach((f,i)=>{ const x=rs.filter(r=>faixaDe(r)===f); if(x.length>=10) pts[i]=x.reduce((s,r)=>s+r.e,0)/x.length; });
    return {m,pts,n:Object.fromEntries(FAIXAS.map((f,i)=>[i,rs.filter(r=>faixaDe(r)===f).length]))};
  });
  const shoppings = [...new Set(lojas.map(l=>l.shopping))].sort((a,b)=>marcasNoShopping(b).size-marcasNoShopping(a).size||a.localeCompare(b));
  const starCol = {5:"#2f9e5b",4:"#7cbf6b",3:"#c9b458",2:"#e08a4e",1:"#d4513f"};
  return html`<div>
    <section class="panel" style=${{marginTop:14}}>
      <div class="ph"><div><h2>${amostra?"Distribuição das estrelas na amostra filtrada":"Distribuição das estrelas no Google"}</h2><p class="sub">${amostra?"Avaliações lidas que passam nos filtros, de 5 a 1 estrela.":"Todas as avaliações do Google das lojas no recorte, de 5 a 1 estrela."}</p></div>
        <div class="legend">${[5,4,3,2,1].map(k=>html`<span key=${k} class="note" style=${{display:"inline-flex",alignItems:"center",gap:5}}><span class="sw" style=${{background:starCol[k],borderRadius:3}}></span>${k}★</span>`)}</div></div>
      <div style=${{display:"grid",gap:12}}>
        ${reps.map(r=>html`<div key=${r.m} style=${{display:"grid",gridTemplateColumns:"minmax(96px,130px) minmax(0,1fr) 70px",gap:12,alignItems:"center"}}>
          <${Brand} m=${r.m}/>
          ${r.dtot?html`<div class="stack" role="img" aria-label=${r.m+": "+[5,4,3,2,1].map(k=>k+" estrelas "+pct(r.dist[k]/r.dtot*100)).join(", ")}>
            ${[5,4,3,2,1].map(k=>{const p=r.dist[k]/r.dtot*100; return html`<div key=${k} title=${`${k}★: ${fmt(r.dist[k])} (${pct(p,1)})`} style=${{width:p+"%",background:starCol[k]}}>${p>=6?pct(p):""}</div>`;})}
          </div>`:html`<span class="note">sem loja</span>`}
          <span class="num" style=${{textAlign:"right",fontWeight:700}}>${fmt(r.nota,2)}</span>
        </div>`)}
      </div>
    </section>

    <div class=${MENSAL?"grid":"grid g2"}>
      <section class="panel">
        <div class="ph"><div><h2>Nota de cada loja, local a local</h2><p class="sub">Compara as marcas dentro do mesmo local, onde o público é o mesmo. Cada célula é uma loja: nota, barra de 3 a 5 na mesma régua para todas e total de avaliações. “▲ melhor” marca a maior nota do local. ${amostra?"Com filtro de avaliação ligado, os números saem da amostra filtrada.":"Sem filtro de avaliação, os números são o total do Google."}</p></div></div>
        <div class="tablewrap"><table class="matrix">
          <thead><tr><th>Local</th>${MARCAS.map(m=>html`<th key=${m}><${Brand} m=${m}/></th>`)}</tr></thead>
          <tbody>${shoppings.map(sh=>{
            const cel = Object.fromEntries(MARCAS.map(m=>{const l=lojas.find(x=>x.shopping===sh&&x.marca===m); return [m,l?{l,...repLoja(l,amostra)}:null];}));
            const vals = MARCAS.map(m=>cel[m]?.nota).filter(v=>v!=null);
            const top = vals.length>1 ? Math.max(...vals) : null;
            return html`<tr key=${sh}>
              <td style=${{fontWeight:600,minWidth:150}}>${sh}<div class="note" style=${{fontWeight:400}}>${vals.length===3?"três marcas":vals.length+(vals.length===1?" marca":" marcas")}</div></td>
              ${MARCAS.map(m=>{const c=cel[m]; if(!c) return html`<td key=${m}><span class="note">Sem loja</span></td>`;
                if(c.nota==null) return html`<td key=${m}><span class="note">Sem avaliações no filtro</span></td>`;
                return html`<td key=${m}><div class="mcell">
                  <div class="v"><b class="num">${fmt(c.nota,2)}</b>${top!=null&&c.nota===top?html`<span class="top" style=${{background:cor(m),color:`var(--b${MI[m]}-ink,#fff)`}} title="Maior nota deste local">▲ melhor</span>`:null}</div>
                  <div class="mtrack"><div style=${{width:Math.max(0,(c.nota-3)/2*100)+"%",background:cor(m)}}></div></div>
                  <span class="note num">${fmt(c.total)} avaliações${amostra?" no filtro":""}</span>
                </div></td>`;})}
            </tr>`;})}</tbody>
        </table></div>

function highlight(text, termo, tema){
  const res = [];
  if(termo) res.push(new RegExp(termo.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"));
  if(tema) res.push(new RegExp(TEMA_POR_ID[tema].re.source,"gi"));
  if(!res.length) return text;
  const re = new RegExp(res.map(r=>r.source).join("|"),"gi");
  const parts=[]; let last=0; let mm;
  while((mm=re.exec(text))){ if(mm[0]==="") {re.lastIndex++; continue;} parts.push(text.slice(last,mm.index)); parts.push(html`<mark key=${mm.index}>${mm[0]}</mark>`); last=mm.index+mm[0].length; }
  parts.push(text.slice(last));
  return parts;
}

function Lojas({lojas,revs,amostra,dia}){
  const [sort,setSort] = useState({k:"shopping",dir:1});
  const hoje = DIAS[new Date().getDay()];
  const lat = LOJAS.map(l=>l.lat), lng = LOJAS.map(l=>l.lng);
  const box = {a:Math.min(...lat)-0.012,b:Math.max(...lat)+0.012,c:Math.min(...lng)-0.015,d:Math.max(...lng)+0.015};
  const W=620,H=440;
  const px = v => (v-box.c)/(box.d-box.c)*W;
  const py = v => (box.b-v)/(box.b-box.a)*H;
  // Agrupa por distancia real (cerca de 400 m), nao pelo nome do local:
  // lojas de redes diferentes no mesmo bairro podem estar longe uma da outra
  const grupos = [];
  lojas.forEach(l=>{
    const g = grupos.find(g=>Math.hypot(g.lat-l.lat, g.lng-l.lng) < 0.0036);
    if(g){ g.ls.push(l); } else grupos.push({lat:l.lat, lng:l.lng, ls:[l]});
  });
  // Rotulos sem sobreposicao: tenta posicoes em volta do ponto e, sem espaco,
  // afasta o texto com uma linha ate o ponto
  const nomeCurto = t => t.replace(/^Rua · /,"").replace(/^Loja de rua · /,"");
  const larg = t => t.length*6.4 + 6, ALT = 15;
  const caixas = [];
  const colide = b => b.x<-16||b.x+b.w>W+16||b.y<2||b.y+b.h>H-2|| caixas.some(c=>b.x<c.x+c.w&&b.x+b.w>c.x&&b.y<c.y+c.h&&b.y+b.h>c.y)
    || grupos.some(g=>{const x=px(g.lng),y=py(g.lat); return x>b.x-9&&x<b.x+b.w+9&&y>b.y-9&&y<b.y+b.h+9;});
  const rotulos = [...grupos].sort((a,b)=>b.lat-a.lat).map((g,gi)=>{
    const cx=px(g.lng), cy=py(g.lat);
    const texto=[...new Set(g.ls.map(l=>nomeCurto(l.shopping)))].join(" / ");
    const w=larg(texto);
    const tentativas=[];
    for(const d of [0,22,44,66]){
      tentativas.push({x:cx+18+d, y:cy-ALT/2, a:"start"},{x:cx-18-d-w, y:cy-ALT/2, a:"end"},
        {x:cx-w/2, y:cy-26-d, a:"middle"},{x:cx-w/2, y:cy+14+d, a:"middle"},
        {x:cx+14+d, y:cy-24-d, a:"start"},{x:cx-14-d-w, y:cy+10+d, a:"end"});
    }
    let esc=tentativas.find(t=>!colide({x:t.x,y:t.y,w,h:ALT})) || tentativas[0];
    caixas.push({x:esc.x,y:esc.y,w,h:ALT});
    const tx = esc.a==="start"?esc.x:esc.a==="end"?esc.x+w:esc.x+w/2;
    const ty = esc.y+ALT-4;
    const ax = Math.min(Math.max(cx, esc.x), esc.x+w), ay = Math.min(Math.max(cy, esc.y), esc.y+ALT);
    return {id:"g"+gi, ls:g.ls, cx, cy, texto, tx, ty, anchor:esc.a, ax, ay, puxado:Math.hypot(ax-cx, ay-cy)>24};
  });
  const [hov,setHov] = useState(null);
  const rows = lojas.map(l=>{
    const st = revStats(revs.filter(r=>r.s===l.id));
    const rp = repLoja(l, amostra);
    let best=null; (dia==="todos"?DIAS:[dia]).forEach(d=>Object.entries(l.pico[d]||{}).forEach(([h,v])=>{ if(v>0&&(!best||v>best.v)) best={d,h:+h,v}; }));
    return {...l, notaF:rp.nota, totalF:rp.total, neg:rp.neg, best, resp:st.resp, hoje:l.horario[hoje]||l.horario[hoje.replace("terca","terça").replace("sabado","sábado")]||"–"};
  });
  const keyf = {shopping:r=>r.shopping+MI[r.marca], marca:r=>MI[r.marca], nota:r=>r.notaF??0, total:r=>r.totalF??0, neg:r=>r.neg??0, pico:r=>r.best?.v??0, resp:r=>r.resp??0};
  rows.sort((a,b)=>{const x=keyf[sort.k](a),y=keyf[sort.k](b); return (x>y?1:x<y?-1:0)*sort.dir;});
  const H_ = ({k,children,r}) => html`<th class=${r?"r":""} aria-sort=${sort.k===k?(sort.dir>0?"ascending":"descending"):"none"}><button onClick=${()=>setSort({k,dir:sort.k===k?-sort.dir:(k==="shopping"||k==="marca"?1:-1)})}>${children}${sort.k===k?(sort.dir>0?" ↑":" ↓"):""}</button></th>`;
  return html`<div>
    <div class="grid g21">
      <section class="panel">
        <div class="ph"><div><h2>Onde estão as lojas</h2><p class="sub">Posição real das lojas, sem mapa de fundo. Lojas a menos de 400 m umas das outras ficam agrupadas num só ponto. Passe o mouse no ponto para ver a marca.</p></div>
          <div class="legend">${MARCAS.map(m=>html`<span class="lg" key=${m}><${Swatch} m=${m}/>${m}</span>`)}</div></div>
        <div class="mapbox tablewrap">
          <svg viewBox=${`-20 -10 ${W+40} ${H+20}`} style=${{width:"100%",minWidth:420,display:"block"}} role="img" aria-label="Mapa esquemático das lojas em Goiânia">
            ${Array.from({length:9},(_,i)=>html`<line key=${"v"+i} x1=${i*W/8} x2=${i*W/8} y1="0" y2=${H} stroke="var(--line)" />`)}
            ${Array.from({length:7},(_,i)=>html`<line key=${"h"+i} y1=${i*H/6} y2=${i*H/6} x1="0" x2=${W} stroke="var(--line)" />`)}
            <text class="city" x=${W-8} y=${H-10} text-anchor="end">GOIÂNIA · GO</text>
            <text x="4" y="12">${fmt(box.b,3)}°</text>
            <text x="4" y=${H-4}>${fmt(box.a,3)}°</text>
            ${rotulos.map(g=>html`<g key=${g.id} onMouseEnter=${()=>setHov(g.id)} onMouseLeave=${()=>setHov(null)} style=${{cursor:"default"}}>
                <circle cx=${g.cx} cy=${g.cy} r="30" fill=${hov===g.id?"var(--chip)":"transparent"} />
                ${g.puxado && html`<line x1=${g.cx} y1=${g.cy} x2=${g.ax} y2=${g.ay} stroke="var(--line-2)" stroke-width="1"/>`}
                ${g.ls.map((l,i)=>{const ang = (i/g.ls.length)*Math.PI*2 - Math.PI/2; const r=g.ls.length>1?11:0; const x=g.cx+Math.cos(ang)*r, y=g.cy+Math.sin(ang)*r;
                  return MI[l.marca]===0 ? html`<circle key=${l.id} cx=${x} cy=${y} r="7" fill=${cor(l.marca)} stroke="var(--panel)" stroke-width="2"><title>${l.marca} · ${l.shopping}</title></circle>`
                    : MI[l.marca]===1 ? html`<rect key=${l.id} x=${x-6.5} y=${y-6.5} width="13" height="13" rx="2" fill=${cor(l.marca)} stroke="var(--panel)" stroke-width="2"><title>${l.marca} · ${l.shopping}</title></rect>`
                    : html`<path key=${l.id} d=${`M${x},${y-8} L${x+7.5},${y+6} L${x-7.5},${y+6} Z`} fill=${cor(l.marca)} stroke="var(--panel)" stroke-width="2"><title>${l.marca} · ${l.shopping}</title></path>`;})}
                <text class="shop" x=${g.tx} y=${g.ty} text-anchor=${g.anchor} paint-order="stroke" stroke="var(--panel-2)" stroke-width="4" stroke-linejoin="round">${g.texto}</text>
              </g>`)}
          </svg>
        </div>
      </section>
      <section class="panel">
        <div class="ph"><div><h2>Presença por local</h2><p class="sub">Onde as três marcas disputam o mesmo público.</p></div></div>
        <table><thead><tr><th>Local</th>${MARCAS.map(m=>html`<th key=${m} style=${{textAlign:"center"}}><${Swatch} m=${m}/></th>`)}</tr></thead>
          <tbody>${SHOPPINGS.map(s=>{const ms=new Set(lojas.filter(l=>l.shopping===s).map(l=>l.marca)); if(!ms.size) return null; return html`<tr key=${s}><td style=${{fontWeight:ms.size===3?700:400}}>${s}</td>${MARCAS.map(m=>html`<td key=${m} style=${{textAlign:"center"}}>${ms.has(m)?html`<${Swatch} m=${m} size=${10}/>`:html`<span class="note">·</span>`}</td>`)}</tr>`;})}</tbody></table>

        <tbody>${rows.map(r=>html`<tr key=${r.id}>

function renderMd(t){
  const linhas = t.split("\n"); const out=[]; let lista=null;
  const inline = s => { const parts=[]; const re=/\*\*(.+?)\*\*/g; let last=0,mm; while((mm=re.exec(s))){parts.push(s.slice(last,mm.index)); parts.push(html`<b key=${mm.index}>${mm[1]}</b>`); last=mm.index+mm[0].length;} parts.push(s.slice(last)); return parts; };
  linhas.forEach((l,i)=>{
    const li = l.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);
    if(li){ (lista ||= []).push(html`<li key=${i}>${inline(li[1])}</li>`); return; }
    if(lista){ out.push(html`<ul key=${"u"+i}>${lista}</ul>`); lista=null; }
    const h = l.match(/^#{1,4}\s+(.*)/);
    if(h) out.push(html`<h4 key=${i}>${inline(h[1])}</h4>`);
    else if(l.trim()) out.push(html`<p key=${i}>${inline(l)}</p>`);
  });
  if(lista) out.push(html`<ul key="uf">${lista}</ul>`);
  return out;
}

function contexto(lojas,revs,filtrosTxt,amostra){
  const marcas = MARCAS.map(m=>{
    const rep=reputacao(lojas,m,amostra), st=revStats(revs.filter(r=>r.marca===m));
    return {marca:m, lojas:rep.lojas, nota_ponderada:+fmt(rep.nota,2).replace(",","."), avaliacoes_google:rep.tot, pct_notas_1e2:+(rep.neg||0).toFixed(1),
      amostra:st.n, media_amostra:st.media&&+st.media.toFixed(2), pct_respondidas:st.resp&&+st.resp.toFixed(0), pct_negativas_respondidas:st.respNeg&&+st.respNeg.toFixed(0),
      temas:Object.fromEntries(TODOS.map(t=>[(t.ehNet?"NET ":"")+t.nome,{citacoes:st.temas[t.id].n, pct_do_texto:+st.temas[t.id].pct.toFixed(1), pct_negativas:st.temas[t.id].neg==null?null:+st.temas[t.id].neg.toFixed(0)}])),
      pico_por_dia:Object.fromEntries(DIAS.map(d=>{const r=resumoCurva(curvaMarca(lojas,m,d).curva); return [d, r?{hora_pico:r.pico,lotacao:Math.round(r.valor),tres_mais_cheias:r.top,mais_vazia:r.vazia}:"fechada"];})),
    };
  });
  const porLoja = lojas.map(l=>{const rp=repLoja(l,amostra); return {marca:l.marca, local:l.shopping, nota:rp.nota==null?null:+rp.nota.toFixed(2), avaliacoes:rp.total, topicos_google:l.topicos};});
  const trechos = [];
  MARCAS.forEach(m=>{
    const rs = revs.filter(r=>r.marca===m&&r.t);
    const neg = rs.filter(r=>r.e<=2).slice(0,25), pos = rs.filter(r=>r.e>=4).slice(0,12), mid = rs.filter(r=>r.e===3).slice(0,5);
    [...neg,...mid,...pos].forEach(r=>trechos.push(`[${m} · ${LOJA[r.s].shopping} · ${r.e}★ · ${r.d}] ${r.t.slice(0,320)}`));
  });
  return `DADOS DO PAINEL (coleta ${D.coleta}, ${D.cidade}, fonte: fichas públicas do Google Maps)
Filtros ativos: ${filtrosTxt}
${amostra?"Nota, avaliações e notas 1 e 2 abaixo saem da amostra filtrada, não do total do Google.":"Nota, avaliações e notas 1 e 2 abaixo são o total do Google."}
Lotação é o percentual de movimento que o Google mostra por hora. As avaliações são uma amostra de até 300 por loja, ${ORDEM_TXT}.

RESUMO POR MARCA (JSON):
${JSON.stringify(marcas)}

POR LOJA (JSON):
${JSON.stringify(porLoja)}

TRECHOS DE AVALIAÇÕES (${trechos.length}):
${trechos.join("\n")}`;
}

function Analista({lojas,revs,filtrosTxt,amostra}){
  const [sample,setSample] = useState(undefined);
  const [q,setQ] = useState("");
  const [resp,setResp] = useState("");
  const [estado,setEstado] = useState("pronto");
  const [erro,setErro] = useState("");
  const ctl = useRef(null);
  useEffect(()=>{ let vivo=true; (async()=>{ const s = window.claude ? await window.claude.use("sample") : null; if(vivo) setSample(s); })(); return ()=>{vivo=false}; },[]);
  const SUG = [
    "Qual marca tem a operação de loja mais problemática e por quê?",
    `Compare as três marcas no local onde a disputa é mais direta: movimento, nota e reclamações.`,
    "Em que dia e horário cada marca precisa de mais gente no caixa?",
    `Resuma as reclamações sobre ${(TEMA_POR_ID[D.destaque_tema]||TEMAS[1]).nome.toLowerCase()}, marca a marca.`,
    `Quais três ações a ${MARCAS[0]} deveria priorizar frente a ${MARCAS.slice(1).join(" e ")}?`,
  ];
  const perguntar = async (pergunta) => {
    if(!sample || !pergunta.trim()) return;
    ctl.current?.abort(); ctl.current = new AbortController();
    setEstado("pensando"); setResp(""); setErro("");
    const prompt = `Você é analista de inteligência de varejo. Responda em português do Brasil, de forma direta, comparando SEMPRE as três marcas (${MARCAS.join(", ")}) quando fizer sentido. Use só os dados abaixo, cite números, e diga quando a amostra for pequena. Formato: um parágrafo curto de resposta, depois tópicos com "- " e negrito com **. Nunca use travessão nem hífen para separar ideias; use ponto ou vírgula.

${contexto(lojas,revs,filtrosTxt,amostra)}

PERGUNTA: ${pergunta}`;
    try{
      const {text} = await sample(prompt,{signal:ctl.current.signal, modelTier:"default", onText:({text})=>{setEstado("escrevendo"); setResp(text);}});
      setResp(text); setEstado("pronto");
    }catch(e){
      setResp(e.text||""); setEstado("pronto");
      const msg = {not_granted:"O acesso à IA não foi liberado nesta visualização.", rate_limited:"Muitas perguntas seguidas. Espere um minuto e pergunte de novo.", cancelled:""}[e.code];
      setErro(msg ?? "Não foi possível responder agora. Tente de novo em instantes.");
      if(e.code==="not_granted") setSample(null);
    }
  };
  if(sample===null) return html`<section class="panel" style=${{marginTop:14}}><h2>Analista <span class="beta">Beta</span></h2><div class="callout" style=${{marginTop:10}}><b>Em construção</b><span>O analista com IA ainda não está disponível nesta versão. Os demais painéis estão completos e usam os mesmos filtros.</span></div></section>`;
  return html`<section class="panel" style=${{marginTop:14}}>
    <div class="callout" style=${{marginTop:0,marginBottom:14}}><b>Beta</b><span>Recurso em construção. As respostas são geradas por IA a partir dos dados do painel e podem ter imprecisões. Confira os números nas outras abas antes de usar.</span></div>
    <div class="ph"><div><h2 style=${{display:"flex",alignItems:"center",gap:8}}>Pergunte ao painel <span class="beta">Beta</span></h2><p class="sub">O analista lê os números e trechos de avaliações do recorte atual (${filtrosTxt}) e responde comparando as três marcas. Cada pergunta usa a sua conta do Claude.</p></div></div>
    <div class="ask">
      <div class="sugg">${SUG.map(s=>html`<button key=${s} onClick=${()=>{setQ(s);perguntar(s);}} disabled=${!sample||estado!=="pronto"}>${s}</button>`)}</div>
      <label class="flabel" for="pergunta">Sua pergunta</label>
      <textarea id="pergunta" value=${q} onInput=${e=>setQ(e.target.value)} placeholder=${`Ex.: onde a ${MARCAS[2]} perde para a ${MARCAS[1]} no mesmo local?`}
        onKeyDown=${e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)) perguntar(q);}}></textarea>
      <div style=${{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        <button class="primary" onClick=${()=>perguntar(q)} disabled=${!sample||estado!=="pronto"||!q.trim()}>${sample===undefined?"Conectando…":"Analisar"}</button>
        ${estado!=="pronto" && html`<button class="ghost" onClick=${()=>ctl.current?.abort()}>Parar</button>`}
        <span class="note">⌘ + Enter envia</span>
      </div>
      ${estado==="pensando" && html`<div class="thinking"><i></i><i></i><i></i> Lendo os dados…</div>`}
      ${erro && html`<div class="callout"><b>Aviso</b><span>${erro}</span></div>`}
      ${resp && html`<div class="answer">${renderMd(resp)}</div>`}
    </div>
  </section>`;
}

/* ------------------------------------------------------------ app */
function App(){
  const [tab,setTab] = useState("panorama");
  const [dia,setDia] = useState("todos");
  const [shop,setShop] = useState("todos");
  const [estrelas,setEstrelas] = useState([]);
  const [tema,setTema] = useState("");
  const [periodo,setPeriodo] = useState("todos");
  const [busca,setBusca] = useState("");
  const [buscaDeb,setBuscaDeb] = useState("");
  useEffect(()=>{ const t=setTimeout(()=>setBuscaDeb(busca.trim()),220); return ()=>clearTimeout(t); },[busca]);

  const lojas = useMemo(()=> shop==="todos" ? LOJAS : shop==="tres" ? LOJAS.filter(l=>marcasNoShopping(l.shopping).size===3) : LOJAS.filter(l=>l.shopping===shop),[shop]);
  const ids = useMemo(()=>new Set(lojas.map(l=>l.id)),[lojas]);
  const per = PERIODOS.find(p=>p.id===periodo);
  const revsBase = useMemo(()=>REVS.filter(r=>ids.has(r.s) && (!estrelas.length||estrelas.includes(r.e)) && per.ok(r.m)),[ids,estrelas,periodo]);
  const revs = useMemo(()=>{
    const q = buscaDeb.toLowerCase();
    return revsBase.filter(r=>(!tema||r.temas.includes(tema)) && (!q||(r.t&&r.t.toLowerCase().includes(q))));
  },[revsBase,tema,buscaDeb]);
  // Parcela de reclamacao por tema nao pode usar o filtro de estrelas: com so
  // 1 e 2 estrelas marcadas tudo vira 100%
  const revsSemEstrela = useMemo(()=>{
    const q = buscaDeb.toLowerCase();
    return REVS.filter(r=>ids.has(r.s) && per.ok(r.m) && (!q||(r.t&&r.t.toLowerCase().includes(q))));
  },[ids,periodo,buscaDeb]);
  // Graficos que abrem por tema mostram todos os temas: ignoram so o filtro de tema
  const revsSemTema = useMemo(()=>{
    const q = buscaDeb.toLowerCase();
    return revsBase.filter(r=>!q||(r.t&&r.t.toLowerCase().includes(q)));
  },[revsBase,buscaDeb]);
  const filtroAval = estrelas.length>0 || periodo!=="todos" || !!tema || !!buscaDeb;
  const amostra = filtroAval ? revs : null;

  const ativos = [];
  if(dia!=="todos") ativos.push({t:"Dia: "+DIA_LONGO[dia], x:()=>setDia("todos")});
  if(shop!=="todos") ativos.push({t:shop==="tres"?"Locais com as três marcas":"Local: "+shop, x:()=>setShop("todos")});
  if(estrelas.length) ativos.push({t:"Estrelas: "+[...estrelas].sort().join(", "), x:()=>setEstrelas([])});
  if(periodo!=="todos") ativos.push({t:"Período: "+per.nome, x:()=>setPeriodo("todos")});
  if(tema) ativos.push({t:"Tema: "+TEMA_POR_ID[tema].nome, x:()=>setTema("")});
  if(buscaDeb) ativos.push({t:`Busca: “${buscaDeb}”`, x:()=>setBusca("")});
  const filtrosTxt = ativos.length ? ativos.map(a=>a.t).join("; ") : "nenhum, Goiânia inteira";
  const limpar = ()=>{setDia("todos");setShop("todos");setEstrelas([]);setPeriodo("todos");setTema("");setBusca("");};
  const pend = LOJAS.filter(l=>l.pendente);
  const escopo = (()=>{
    const partes = [];
    if(filtroAval && (tab==="movimento")) partes.push("Movimento vem do Google hora a hora e não depende das avaliações. Nesta aba valem só Dia e Locais.");
    if(dia!=="todos" && (tab==="reputacao"||tab==="voz"||tab==="ia")) partes.push("Avaliações não têm dia da semana, então o filtro de dia não muda esta aba. Ele vale para Panorama (pico), Movimento e Lojas.");
    if(filtroAval && (tab==="panorama"||tab==="reputacao"||tab==="lojas")) partes.push("Com filtro de período, estrelas, tema ou busca ligado, nota, avaliações e estrelas passam a ser calculadas sobre as avaliações lidas que passam no filtro, não sobre o total do Google.");
    return partes.join(" ");
  })();

  const TABS = [{id:"panorama",nome:"Panorama"},{id:"movimento",nome:"Movimento"},{id:"reputacao",nome:"Reputação"},{id:"voz",nome:"Voz do cliente"},{id:"lojas",nome:"Lojas"},{id:"ia",nome:"Analista IA",beta:true}];

  return html`<div class="wrap">
    <header class="top">
      <div class="brandmark">
        <span class="eyebrow">Inteligência de varejo · ${D.cidade}</span>
        <h1>${D.titulo || "C&A, Renner e Riachuelo, loja a loja"}</h1>
        <div class="meta"><span>Coleta <b>${new Date(D.coleta+"T12:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"short",year:"numeric"})}</b></span><span><b>${LOJAS.length}</b> lojas</span><span><b>${fmt(REVS.length)}</b> avaliações lidas</span><span>Fonte: Google Maps</span></div>
      </div>
      <div class="legend" aria-label="Legenda das marcas">${MARCAS.map(m=>html`<span class="lg" key=${m}><${Swatch} m=${m}/>${m}</span>`)}</div>
    </header>

    <div class="filters">
      <div class="frow">
        <div class="fld"><span class="flabel">Dia da semana</span>
          <${Seg} value=${dia} onChange=${setDia} label="Dia da semana" options=${[{id:"todos",nome:"Semana"},...DIAS.map(d=>({id:d,nome:DIA_CURTO[d]}))]}/></div>
        <div class="fld"><label for="f-shop">Locais</label>
          <select id="f-shop" value=${shop} onChange=${e=>setShop(e.target.value)}>
            <option value="todos">Todos os locais</option>
            <option value="tres">Só locais com as três marcas</option>
            ${SHOPPINGS.map(s=>html`<option key=${s} value=${s}>${s} (${[...marcasNoShopping(s)].length}/3)</option>`)}
          </select></div>
        <div class="fld"><span class="flabel">Estrelas</span>
          <div class="seg stars" role="group" aria-label="Estrelas">${[1,2,3,4,5].map(k=>html`<button key=${k} type="button" aria-pressed=${estrelas.includes(k)} onClick=${()=>setEstrelas(estrelas.includes(k)?estrelas.filter(x=>x!==k):[...estrelas,k])}>${k}★</button>`)}</div></div>
        <div class="fld"><label for="f-tema">Tema</label>
          <select id="f-tema" value=${tema} onChange=${e=>setTema(e.target.value)}><option value="">Todos os temas</option>${NETS.map(n=>html`<optgroup key=${n.id} label=${n.nome}><option value=${n.id}>${n.nome} (net inteira)</option>${TEMAS.filter(t=>t.net===n.net).map(t=>html`<option key=${t.id} value=${t.id}>${t.nome}</option>`)}</optgroup>`)}</select></div>
        <div class="fld"><label for="f-per">Período da avaliação</label>
          <select id="f-per" value=${periodo} onChange=${e=>setPeriodo(e.target.value)}>${PERIODOS.map(p=>html`<option key=${p.id} value=${p.id}>${p.nome}</option>`)}</select></div>
        <div class="fld"><label for="f-busca">Buscar no texto</label>
          <input id="f-busca" type="search" value=${busca} onInput=${e=>setBusca(e.target.value)} placeholder="provador, troca, Pix…"/></div>
      </div>
      <div class="active" aria-live="polite">
        ${ativos.length ? html`${ativos.map(a=>html`<span class="pill" key=${a.t}>${a.t}<button type="button" aria-label=${"Remover "+a.t} onClick=${a.x}>×</button></span>`)}<button class="linkbtn" onClick=${limpar}>Limpar tudo</button>`
          : html`<span class="note">Sem filtros. Cada gráfico mostra sempre as três marcas.</span>`}
      </div>
      ${escopo && html`<div class="escopo"><span class="tag t-info">Como os filtros agem aqui</span><span>${escopo}</span></div>`}
    </div>

    <nav class="tabs" role="tablist" aria-label="Seções">
      ${TABS.map(t=>html`<button key=${t.id} role="tab" id=${"tab-"+t.id} aria-selected=${tab===t.id} class=${t.id==="ia"?"ai":""} onClick=${()=>setTab(t.id)}>${t.nome}${t.beta?html` <span class="beta">Beta</span>`:null}</button>`)}
    </nav>

    <main role="tabpanel" aria-labelledby=${"tab-"+tab}>
      ${tab==="panorama" && html`<${Panorama} lojas=${lojas} revs=${revs} revsTemas=${revsSemTema} revsNeg=${revsSemEstrela} amostra=${amostra} dia=${dia} setTab=${setTab} setTema=${setTema}/>`}
      ${tab==="movimento" && html`<${Movimento} lojas=${lojas} dia=${dia} setDia=${setDia}/>`}
      ${tab==="reputacao" && html`<${Reputacao} lojas=${lojas} revs=${revs} revsNeg=${revsSemEstrela} amostra=${amostra} estrelas=${estrelas} setEstrelas=${setEstrelas}/>`}
      ${tab==="voz" && html`<${Voz} lojas=${lojas} revs=${revs} revsTemas=${revsSemTema} revsNeg=${revsSemEstrela} estrelas=${estrelas} tema=${tema} setTema=${setTema} busca=${buscaDeb}/>`}
      ${tab==="lojas" && html`<${Lojas} lojas=${lojas} revs=${revs} amostra=${amostra} dia=${dia}/>`}
      ${tab==="ia" && html`<${Analista} lojas=${lojas} revs=${revs} filtrosTxt=${filtrosTxt} amostra=${amostra}/>`}
    </main>

    <footer class="foot">
      ${pend.length ? html`<div class="callout" style=${{marginBottom:12}}><b>Coleta parcial</b><span>${pend.map(l=>`${l.marca} ${l.shopping}`).join(", ")}: o Google limitou o acesso durante a coleta e as avaliações e o gráfico de movimento dessa loja ficaram de fora. A nota e o total no Google continuam valendo.</span></div>`:null}
      Lotação por hora é o índice relativo que o Google Maps mostra em “Horários de pico” (100% é a hora mais cheia daquela loja na semana). As avaliações são uma amostra de até 300 por loja, ${ORDEM_TXT}, com datas aproximadas a partir de “há X meses”. Sem filtro de avaliação, nota e distribuição de estrelas usam todas as avaliações do Google; com filtro de período, estrelas, tema ou busca, usam as avaliações lidas que passam no filtro. Lojas de outros municípios ficaram fora do recorte. Nomes de autores não são exibidos.
    </footer>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("app")).render(html`<${App}/>`);
})();
</script>
