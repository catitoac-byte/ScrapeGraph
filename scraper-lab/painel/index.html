<title>Rival Pulse</title>
<meta name="description" content="C&A, Renner e Riachuelo comparadas loja a loja em Goiânia: movimento por hora, reputação e voz do cliente no Google.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Rival Pulse: trilho lateral, superficies macias, numeros grandes e finos.
   Acento lima so para interface; as cores de marca ficam para os dados. */
:root{
  color-scheme:light;
  --bg:#ECEEF1; --panel:#FFFFFF; --panel-2:#F4F5F7; --sunk:#E6E9ED; --glass:rgba(255,255,255,.78);
  --ink:#0F1318; --ink-2:#555D68; --ink-3:#8A919B; --line:#E4E7EB; --line-2:#D3D8DE;
  --rail:#0F1318; --rail-ink:#9AA3AE; --rail-on:#D9F26A; --rail-on-ink:#0F1318;
  --accent:#D9F26A; --accent-ink:#0F1318; --accent-soft:#EEF8C6;
  --focus:#0F1318; --chip:#EEF0F3; --chip-on:#0F1318; --chip-on-ink:#FFFFFF;
  --b0:#2a78d6; --b1:#eb6834; --b2:#1baf7a; --b0-soft:#2a78d61f; --b1-soft:#eb68341f; --b2-soft:#1baf7a1f;
  --good:#1D8A4E; --warn:#B7791F; --crit:#C53030;
  --good-bg:#1D8A4E17; --warn-bg:#B7791F1C; --crit-bg:#C530301A;
  --heat-0:#EEF0F3;
  --tip:#0F1318; --tip-ink:#F2F4F6;
  --shadow:0 1px 2px rgba(15,19,24,.04), 0 14px 34px -22px rgba(15,19,24,.22);
  --lift:0 1px 2px rgba(15,19,24,.06), 0 18px 40px -20px rgba(15,19,24,.30);
  --r:22px; --r-sm:14px;
  --f-display:"Outfit","Avenir Next",system-ui,sans-serif;
  --f-body:"Instrument Sans","Helvetica Neue",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B0D10; --panel:#15181D; --panel-2:#1B1F25; --sunk:#101318; --glass:rgba(21,24,29,.78);
    --ink:#EEF1F4; --ink-2:#A7AFBA; --ink-3:#737C88; --line:#232830; --line-2:#313843;
    --rail:#15181D; --rail-ink:#8B94A0; --rail-on:#D9F26A; --rail-on-ink:#0F1318;
    --accent:#D9F26A; --accent-ink:#0F1318; --accent-soft:#2A3016;
    --focus:#EEF1F4; --chip:#1E232A; --chip-on:#EEF1F4; --chip-on-ink:#0B0D10;
    --good:#43C47F; --warn:#E0A84A; --crit:#F07070; --good-bg:#43C47F1F; --warn-bg:#E0A84A1F; --crit-bg:#F070701F;
    --heat-0:#1B1F25; --tip:#EEF1F4; --tip-ink:#0F1318;
    --shadow:0 1px 0 rgba(0,0,0,.35), 0 16px 36px -22px rgba(0,0,0,.8);
    --lift:0 1px 0 rgba(0,0,0,.4), 0 20px 44px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0D10; --panel:#15181D; --panel-2:#1B1F25; --sunk:#101318; --glass:rgba(21,24,29,.78);
  --ink:#EEF1F4; --ink-2:#A7AFBA; --ink-3:#737C88; --line:#232830; --line-2:#313843;
  --rail:#15181D; --rail-ink:#8B94A0; --rail-on:#D9F26A; --rail-on-ink:#0F1318;
  --accent:#D9F26A; --accent-ink:#0F1318; --accent-soft:#2A3016;
  --focus:#EEF1F4; --chip:#1E232A; --chip-on:#EEF1F4; --chip-on-ink:#0B0D10;
  --good:#43C47F; --warn:#E0A84A; --crit:#F07070; --good-bg:#43C47F1F; --warn-bg:#E0A84A1F; --crit-bg:#F070701F;
  --heat-0:#1B1F25; --tip:#EEF1F4; --tip-ink:#0F1318;
  --shadow:0 1px 0 rgba(0,0,0,.35), 0 16px 36px -22px rgba(0,0,0,.8);
  --lift:0 1px 0 rgba(0,0,0,.4), 0 20px 44px -18px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* estrutura: trilho + area principal */
.app{display:grid;grid-template-columns:88px minmax(0,1fr);min-height:100vh;transition:grid-template-columns .45s cubic-bezier(.6,0,.2,1)}
.app.aberto{grid-template-columns:236px minmax(0,1fr)}
.rail{position:sticky;top:0;height:100vh;padding:18px 0;display:flex;flex-direction:column;align-items:stretch;gap:6px;z-index:45}
.rail-in{background:var(--rail);border-radius:28px;margin:0 14px;padding:14px 8px;display:flex;flex-direction:column;align-items:stretch;gap:6px;height:100%}
.mark-logo{display:block;width:60px;align-self:center;transition:width .45s cubic-bezier(.6,0,.2,1);padding:6px 4px 14px;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.1);text-align:center;border-radius:10px}
.mark-logo img{width:100%;height:auto;display:block}
.logo-verde{display:block;width:100%;aspect-ratio:200/67;background:var(--rail-on);-webkit-mask:url(/cassi-wordmark-reversed.svg) center/contain no-repeat;mask:url(/cassi-wordmark-reversed.svg) center/contain no-repeat}
.mark-logo:hover img,.mark-logo:hover .logo-verde{opacity:.8}
.mark-txt{color:#fff;font:600 13px var(--f-display)}
.mark{width:40px;height:40px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 19px var(--f-display);margin-bottom:12px}
.tabs{position:relative;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.tabs button{position:relative;z-index:1;width:100%;height:48px;border:0;border-radius:16px;background:transparent;color:var(--rail-ink);display:flex;align-items:center;gap:12px;padding:0 13px;transition:background .2s,color .25s}
.tabs .rot{display:none;white-space:nowrap;font-weight:600;font-size:13.5px}
.aberto .tabs .rot{display:inline;animation:rot-in .35s .12s both}
@keyframes rot-in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.aberto .tabs .tip-nav,.aberto .tabs .dot-beta{display:none}
.aberto .mark-logo{width:96px}
.recolher{margin-top:auto;height:40px;border:0;border-radius:14px;background:rgba(255,255,255,.06);color:var(--rail-ink);display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden}
.recolher:hover{background:rgba(255,255,255,.12);color:#fff}
.recolher svg{width:18px;height:18px;flex:none;transition:transform .45s cubic-bezier(.6,0,.2,1)}
.aberto .recolher svg{transform:rotate(180deg)}
.recolher .rot{display:none}
.aberto .recolher .rot{display:inline}
.tabs button:hover{background:rgba(255,255,255,.08);color:#fff}
.tabs button[aria-selected="true"]{background:var(--rail-on);color:var(--rail-on-ink)}
.tabs:has(>.gota.pronta) button[aria-selected="true"]{background:transparent}
.tabs button svg{width:21px;height:21px;flex:none}
.tabs .tip-nav,.rail-btn .tip-nav{position:absolute;left:58px;top:50%;transform:translateY(-50%);background:var(--tip);color:var(--tip-ink);font-size:12px;font-weight:600;padding:5px 9px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:40}
.rail-btn .tip-nav{opacity:0;pointer-events:none}
.tabs button:hover .tip-nav,.tabs button:focus-visible .tip-nav{opacity:1}
.tabs .dot-beta{position:absolute;top:8px;left:32px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.wrap{padding-inline:28px 32px;padding-block:22px 64px;min-width:0;max-width:1440px}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:auto 0 0 0;height:auto;padding:10px 12px;z-index:50}
  .rail-in{flex-direction:row;height:auto;margin:0;padding:6px;border-radius:22px;justify-content:space-around;box-shadow:0 0 0 1px var(--line-2),var(--lift)}
  .mark,.mark-logo,.recolher{display:none}
  .app.aberto{grid-template-columns:minmax(0,1fr)}
  .tabs .rot{display:none}
  .tabs button{width:48px;justify-content:center;padding:0}
  .tabs{flex-direction:row;gap:2px;width:100%;justify-content:space-around}
  .tabs .tip-nav{display:none}
  .wrap{padding-inline:16px;padding-block:14px 110px}
}

/* cabecalho */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 28px;padding-block:6px 18px}
.brandmark{display:flex;flex-direction:column;gap:6px;min-width:0}
.eyebrow{font-size:12px;color:var(--ink-3);font-weight:500}
h1{font-family:var(--f-display);font-weight:300;font-size:clamp(28px,3.2vw,40px);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1 b{font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px;color:var(--ink-2);font-size:12.5px}
.meta span{background:var(--panel);border-radius:999px;padding:4px 11px;box-shadow:var(--shadow)}
.meta b{color:var(--ink);font-weight:600}
.legend{display:flex;gap:8px;flex-wrap:wrap}
.lg{display:inline-flex;align-items:center;gap:8px;padding:7px 13px 7px 10px;border-radius:999px;background:var(--panel);box-shadow:var(--shadow);font-weight:600;font-size:13px}
.sw{width:12px;height:12px;display:inline-block;flex:none}
.sh0{border-radius:50%}.sh1{border-radius:3px}.sh2{clip-path:polygon(50% 0,100% 100%,0 100%)}

/* filtros em pilulas */
.filters{position:sticky;top:10px;z-index:30;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow);padding:6px}
.filters{border-radius:26px}
@media (min-width:1180px){.filters:not(:has(.active)):not(:has(.escopo)){border-radius:999px}}
.chipsel{display:inline-flex;align-items:center;gap:2px;height:38px;border-radius:999px;background:var(--chip);padding:0 4px 0 14px;min-width:0;transition:background .15s}
.chipsel:hover{background:var(--sunk)}
.chipsel>span{margin-right:6px;font-size:11.5px;color:var(--ink-3);font-weight:600;white-space:nowrap}
.chipsel select{background:transparent;height:34px;padding:0 26px 0 6px;font-weight:600;max-width:210px;text-overflow:ellipsis}
.chipsel select:hover{background:transparent}
.chipsel.estrelas{padding-right:4px;gap:1px}
.chipsel.estrelas button{border:0;background:transparent;border-radius:999px;height:30px;min-width:34px;padding:0 7px;font-weight:600;font-size:12.5px;color:var(--ink-2)}
.chipsel.estrelas button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.limpar{border:0;height:38px;border-radius:999px;padding:0 16px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
@media (max-width:1180px){.filters{position:static}}

.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label,.flabel{font-size:11px;color:var(--ink-3);font-weight:600;padding-left:4px}
select,input[type=search]{height:36px;border-radius:999px;border:0;background:var(--chip);padding:0 14px;min-width:0;max-width:100%;font-weight:500}
select{padding-right:30px}
input[type=search]{width:210px}
select:hover,input[type=search]:hover{background:var(--sunk)}
.seg{position:relative;display:flex;flex-wrap:wrap;background:var(--chip);border-radius:999px;padding:3px;gap:2px;--gota-cor:var(--chip-on)}
.seg button{position:relative;z-index:1}
.seg:has(>.gota.pronta) button[aria-pressed="true"]{background:transparent}
/* gota: indicador que escorre de um item para outro */
.gota{position:absolute;inset:0;pointer-events:none;z-index:0;filter:url(#gota);opacity:0;transition:opacity .2s}
.gota.on{opacity:1}
.gota i{position:absolute;left:0;top:0;width:var(--w,0);height:var(--h,0);border-radius:var(--r,999px);background:var(--gota-cor,var(--accent));transform:translate(var(--x,0),var(--y,0))}
.gota.pronta .ga{transition:transform .5s cubic-bezier(.5,1.45,.45,1),width .35s,height .35s}
.gota.pronta .gb{transition:transform .8s cubic-bezier(.25,.9,.3,1),width .5s,height .5s}
.gota .gb{border-radius:999px;width:calc(var(--w,0) * .62);height:calc(var(--h,0) * .62);margin:calc(var(--h,0) * .19) 0 0 calc(var(--w,0) * .19)}
.tabs{--gota-cor:var(--rail-on)}.tabs .gota i{--r:16px}
.seg button{border:0;background:transparent;border-radius:999px;height:30px;padding:0 11px;font-weight:600;font-size:12.5px;color:var(--ink-2);transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.stars button{min-width:34px}
.active{display:flex;flex-wrap:wrap;gap:6px;margin:8px 6px 4px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--accent-soft);padding:3px 4px 3px 11px;font-size:12px;font-weight:600}
.pill button{border:0;background:var(--panel);border-radius:999px;width:20px;height:20px;line-height:1;color:var(--ink-2)}
.linkbtn{border:0;background:none;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;font-size:12px;padding:2px 4px}
.escopo{display:flex;gap:10px;align-items:flex-start;margin:8px 8px 4px;font-size:12.5px;color:var(--ink-2);max-width:110ch}
.beta{display:inline-block;font-family:var(--f-body);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 8px;background:var(--accent);color:var(--accent-ink);vertical-align:3px}

/* grade e cartoes */
main{margin-top:18px}
.grid{display:grid;gap:18px;margin-top:18px}
main>div>.grid:first-child,main>.entra>div>.grid:first-child{margin-top:0}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:1060px){.g3,.g2,.g21{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border-radius:var(--r);padding:22px 22px 20px;min-width:0;box-shadow:var(--shadow)}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
h2{font-family:var(--f-display);font-weight:500;font-size:19px;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0;font-weight:600}
.sub{color:var(--ink-2);font-size:12.5px;margin:4px 0 0;max-width:72ch}
.note{color:var(--ink-3);font-size:12px}

/* cartoes de marca: numero grande e fino */
.brandcard{position:relative;overflow:hidden;border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}
.brandcard:hover{transform:translateY(-2px);box-shadow:var(--lift)}
.bc-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 0}
.bc-name{display:inline-flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:600;font-size:16px;background:var(--panel-2);border-radius:999px;padding:6px 14px 6px 10px}
.bc-stores{font-size:12px;color:var(--ink-3)}
.bc-hero{display:flex;align-items:flex-end;gap:14px;padding:14px 20px 8px}
.bc-big{font-family:var(--f-display);font-weight:200;font-size:68px;line-height:.9;letter-spacing:-.04em}
.bc-stars{display:flex;flex-direction:column;gap:4px;padding-bottom:8px}
.starrow{display:flex;gap:2px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px 14px 16px;margin:0}
.kv>div{background:var(--panel-2);border-radius:var(--r-sm);padding:10px 12px}
.kv dt{font-size:11px;color:var(--ink-3);font-weight:500}
.kv dd{margin:3px 0 0;font-weight:600;font-size:15px}
.rank{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.r-best{background:var(--good-bg);color:var(--good)}
.r-worst{background:var(--crit-bg);color:var(--crit)}
.empty{padding:40px 18px;color:var(--ink-3);text-align:center}

/* leitura rapida */
.insights{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.insights li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:12px 14px;border-radius:var(--r-sm);background:var(--panel-2)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:3px 9px;white-space:nowrap}
.t-good{background:var(--good-bg);color:var(--good)}
.t-warn{background:var(--warn-bg);color:var(--warn)}
.t-crit{background:var(--crit-bg);color:var(--crit)}
.t-info{background:var(--chip);color:var(--ink-2)}

/* graficos */
svg text{fill:var(--ink-3);font-family:var(--f-mono);font-size:10.5px}
.chartwrap{position:relative;width:100%}
.tip{position:absolute;pointer-events:none;background:var(--tip);color:var(--tip-ink);border-radius:14px;padding:10px 12px;font-size:12px;min-width:160px;z-index:5;transform:translate(-50%,-100%);white-space:nowrap;box-shadow:var(--lift)}
.tip .tt{font-weight:700;margin-bottom:6px;font-family:var(--f-display);font-size:13px}
.tip .tr{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:1px 0}
.tip .tr span:first-child{display:flex;align-items:center;gap:6px;opacity:.8}
.heat{display:grid;gap:3px}
.heat .cell{height:24px;border-radius:7px;position:relative;transition:transform .12s}
.heat .lab{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);display:flex;align-items:center}
.heat .cell:hover{outline:2px solid var(--ink);outline-offset:0;z-index:2;transform:scale(1.08)}
.bar-row{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr);gap:12px;align-items:center;padding:7px 0}
.bars{display:flex;flex-direction:column;gap:4px}
.barline{display:grid;grid-template-columns:minmax(0,1fr) 44px;align-items:center;gap:8px}
.track{height:10px;border-radius:999px;background:var(--panel-2);overflow:hidden}
.bar{height:100%;border-radius:999px;min-width:0;transition:width .3s}
.bar-lab{font-size:13px;font-weight:600}
.bar-lab small{display:block;font-weight:400;color:var(--ink-3);font-size:11px}
.clickable{cursor:pointer;border-radius:var(--r-sm);padding-inline:10px;margin-inline:-10px;transition:background .15s}
.clickable:hover{background:var(--panel-2)}
.clickable[aria-pressed="true"]{background:var(--accent-soft)}
.stack{display:flex;height:30px;border-radius:999px;overflow:hidden;gap:3px;background:var(--panel)}
.stack>div{height:100%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;min-width:0;overflow:hidden}

/* tabelas: linha em foco levanta */
.tablewrap{overflow-x:auto;margin-inline:-6px;padding-inline:6px}
table{border-collapse:separate;border-spacing:0 4px;width:100%;font-size:13px}
th{font-size:11px;color:var(--ink-3);text-align:left;font-weight:600;padding:6px 12px;white-space:nowrap}
th button{border:0;background:none;padding:0;font:inherit;color:inherit}
td{padding:11px 12px;background:var(--panel-2);vertical-align:middle;transition:background .15s}
td:first-child{border-radius:12px 0 0 12px}
td:last-child{border-radius:0 12px 12px 0}
td.r,th.r{text-align:right}
tbody tr{transition:transform .15s,box-shadow .15s}
tbody tr:hover{transform:translateY(-1px);box-shadow:var(--lift);border-radius:12px}
tbody tr:hover td{background:var(--panel)}
.bdot{display:inline-flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px}

/* avaliacoes */
.revcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:14px}
@media (max-width:1060px){.revcols{grid-template-columns:minmax(0,1fr)}}
.revcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.revhead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:var(--r-sm);background:var(--panel);box-shadow:var(--shadow)}
.rev{background:var(--panel);border-radius:var(--r-sm);padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}

/* analista */
.ask{display:flex;flex-direction:column;gap:10px}
textarea{width:100%;min-height:96px;resize:vertical;border-radius:var(--r-sm);border:0;background:var(--panel-2);padding:14px;line-height:1.5}
.sugg{display:flex;flex-wrap:wrap;gap:6px}

.sugg button:hover{background:var(--accent-soft)}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;height:40px;padding:0 20px;font-weight:700}
.primary:disabled{opacity:.5;cursor:default}
.ghost{background:var(--chip);border:0;border-radius:999px;height:40px;padding:0 16px;font-weight:600}
.answer{font-size:14.5px;line-height:1.65;max-width:78ch}

.foot{margin-top:30px;color:var(--ink-3);font-size:12px;max-width:95ch;line-height:1.6}
.callout{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r-sm);padding:12px 14px;background:var(--warn-bg);color:var(--ink);font-size:12.5px;margin-top:12px}

.maxpk{display:inline-block;color:#fff;font-weight:700;border-radius:999px;padding:1px 8px}
.info{position:relative;display:inline-flex}
.info>button{width:18px;height:18px;border-radius:50%;border:0;background:var(--chip);color:var(--ink-2);font-size:11px;font-weight:800;line-height:1;padding:0;display:inline-flex;align-items:center;justify-content:center}

.matrix td{vertical-align:top}
.mcell{display:grid;grid-template-rows:30px 8px auto;row-gap:7px;min-width:130px}
.mcell .v{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;white-space:nowrap;height:30px;overflow:hidden}

.evo{display:flex;flex-direction:column;gap:6px}

.secao-t .beta{background:var(--accent-ink);color:var(--accent)}
@keyframes bolha{0%{transform:translateX(-26px) scale(.55,.8);border-radius:40% 60% 55% 45%/60% 40% 60% 40%;opacity:0}55%{transform:translateX(4px) scale(1.06,.94);opacity:1}100%{transform:none;border-radius:999px}}
.entra{animation:entra .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.linha{stroke-dasharray:1;stroke-dashoffset:1;animation:desenha 1.1s cubic-bezier(.5,0,.2,1) forwards}
@keyframes desenha{to{stroke-dashoffset:0}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<script src="data.js"></script>
<script>
(function(){
const {useState,useMemo,useEffect,useRef,useCallback} = React;
const html = htm.bind(React.createElement);
const D = window.PAINEL;

// Idioma: ?lang= na URL, depois a escolha salva, depois o navegador. Trocar recarrega a pagina.
const LANG = (()=>{ let v=null; try{ v=new URLSearchParams(location.search).get("lang")||localStorage.getItem("vitrine-idioma"); }catch(e){}
  v = v || (navigator.language||"pt").slice(0,2).toLowerCase(); return ["pt","es","en"].includes(v)?v:"pt"; })();
// Vocabulario da vertical: troca palavras dos textos fixos (ex.: "loja" vira
// "unidade" em imobiliarias). Sem "vocabulario" no JSON da vertical, nada muda.
const VOC = ((D.vocabulario||{})[LANG]||[]).map(([de,para])=>[new RegExp(de,"g"),para]);
const L3 = (pt,es,en) => { const s = LANG==="es"?es:LANG==="en"?en:pt;
  return VOC.length && typeof s==="string" ? VOC.reduce((t,[re,p])=>t.replace(re,p), s) : s; };
const LOCALE = L3("pt-BR","es-ES","en-US");
document.documentElement.lang = L3("pt-BR","es","en");
const TR = k => (D.i18n&&D.i18n[LANG]&&D.i18n[LANG][k]) || D[k];
const trocarIdioma = l => { try{ localStorage.setItem("vitrine-idioma",l); }catch(e){} const u=new URL(location.href); u.searchParams.delete("lang"); u.hash=""; location.replace(u.toString()); };

// Cores reais das marcas (verticais/<id>.json), com os tons do tema escuro.
// Texto sobre a cor da marca: branco ou tinta escura, pelo contraste.
(function(){
  if(!D.cores) return;
  const lum = h => { const c=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)); return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]; };
  const tinta = h => (1.05/(lum(h)+0.05)) >= 4.5 ? "#FFFFFF" : "#0D131D";
  const bloco = cs => cs.map((c,i)=>`--b${i}:${c};--b${i}-soft:${c}24;--b${i}-ink:${tinta(c)};`).join("");
  const st = document.createElement("style");
  st.textContent = `:root{${bloco(D.cores.light)}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${bloco(D.cores.dark)}}}
:root[data-theme="dark"]{${bloco(D.cores.dark)}}`;
  document.head.appendChild(st);
})();

/* ------------------------------------------------------------ base */
// Marcas, temas e textos vem da vertical (verticais/<id>.json via gerar_dados.py)
const MARCAS = D.marcas || ["C&A","Renner","Riachuelo"];
const MI = Object.fromEntries(MARCAS.map((m,i)=>[m,i]));
// "da C&A", "do Assaí": artigo de cada marca vem da vertical
const nCod = net => { const n=TEMAS.filter(c=>c.net===net).length; return n+" "+(n===1?L3("código","código","code"):L3("códigos","códigos","codes")); };
const de = m => L3(((D.artigos||{})[m]==="o" ? "do " : "da ") + m, "de "+m, "for "+m);
const netNome = n => (D.nets_i18n&&D.nets_i18n[n]&&D.nets_i18n[n][LANG]) || n;
const localNome = s => s.replace(/^Rua · /, L3("Rua · ","Calle · ","Street · ")).replace(/^Loja de rua/, L3("Loja de rua","Tienda de calle","Street store"));
const cor = m => `var(--b${MI[m]})`;
const soft = m => `var(--b${MI[m]}-soft)`;
const DIAS = D.dias;
const _DK = ["domingo","segunda-feira","terca-feira","quarta-feira","quinta-feira","sexta-feira","sabado"];
const DIA_CURTO = Object.fromEntries(_DK.map((k,i)=>[k, L3(["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"],["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"],["Sun","Mon","Tue","Wed","Thu","Fri","Sat"])[i]]));
const DIA_LONGO = Object.fromEntries(_DK.map((k,i)=>[k, L3(["domingo","segunda","terça","quarta","quinta","sexta","sábado"],["domingo","lunes","martes","miércoles","jueves","viernes","sábado"],["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"])[i]]));
const cap = t => t ? t[0].toUpperCase()+t.slice(1) : t;
const HORAS = Array.from({length:18},(_,i)=>i+6);
const fmt = (n,d=0)=> n==null||isNaN(n) ? "–" : n.toLocaleString(LOCALE,{minimumFractionDigits:d,maximumFractionDigits:d});
const pct = (n,d=0)=> n==null||isNaN(n) ? "–" : fmt(n,d)+"%";
const hh = h => LANG==="en" ? (h===0?"12am":h<12?h+"am":h===12?"12pm":(h-12)+"pm") : String(h).padStart(2,"0")+"h";

const TEMAS_MODA = [
  {id:"atendimento", nome:"Atendimento", re:/atend|vendedor|funcion[aá]ri|educad|grosse|simp[aá]tic|mal educ|gerente|equipe/i},
  {id:"fila", nome:"Fila e caixa", re:/\bfila|caixa|demor|esper[ae]i|lentid/i},
  {id:"cartao", nome:"Cartão e crédito", re:/cart[aã]o|cr[eé]dito|juros|\bpay\b|fatura|cobran|empr[eé]stimo|parcel/i},
  {id:"preco", nome:"Preço e promoção", re:/pre[çc]o|barat|\bcaro|promo|oferta|desconto|liquida/i},
  {id:"produto", nome:"Variedade e produto", re:/variedad|op[çc][õo]es|modelo|cole[çc]|pe[çc]as|qualidade|tecido|estilo/i},
  {id:"tamanho", nome:"Tamanhos", re:/tamanho|numera[çc]|plus size|\bgg\b|\bpp\b/i},
  {id:"provador", nome:"Provador", re:/provador/i},
  {id:"troca", nome:"Troca e devolução", re:/\btroca|devolu|reembols|estorno/i},
  {id:"organizacao", nome:"Organização e limpeza", re:/organiz|bagun|limp[ae]|suj[ao]|arrumad|desarrum/i},
  {id:"estrutura", nome:"Espaço e conforto", re:/ar condicionado|espa[çc]o|ampl[ao]|banheiro|estacionamento|acess[ií]v|climatiz|quente/i},
];
// Livro de codigos: codigos (TEMAS) agrupados em nets. Uma net marca a
// avaliacao que cita qualquer codigo dela.
const TEMAS = D.temas ? D.temas.map(t=>({id:t.id, nome:(LANG!=="pt"&&t["nome_"+LANG])||t.nome, net:t.net||"Temas", re:new RegExp(t.re,"i")})) : TEMAS_MODA.map(t=>({...t,net:"Temas"}));
const NETS = [...new Set(TEMAS.map(t=>t.net))].map(n=>{
  const cods = TEMAS.filter(t=>t.net===n);
  return {id:"net-"+n.normalize("NFD").replace(/[^\w]+/g,"-").toLowerCase(), nome:netNome(n), net:n, ehNet:true, codigos:cods.map(c=>c.id),
    re:new RegExp(cods.map(c=>"(?:"+c.re.source+")").join("|"),"i")};
});
const TODOS = [...NETS, ...TEMAS];
const TEMA_POR_ID = Object.fromEntries(TODOS.map(t=>[t.id,t]));

const LOJAS = D.lojas;
const FAIXA_AMOSTRA = (()=>{ const c={}; D.avaliacoes.forEach(r=>{c[r.s]=(c[r.s]||0)+1;}); const v=Object.values(c); if(!v.length) return ""; const a=Math.min(...v), b=Math.max(...v); return a===b?L3(`de ${b} avaliações por loja`,`de ${b} reseñas por tienda`,`of ${b} reviews per store`):L3(`de ${a} a ${b} avaliações por loja`,`de ${a} a ${b} reseñas por tienda`,`of ${a} to ${b} reviews per store`); })();
const ORDEM_TXT = D.ordenacao === "mais recentes" ? L3("as mais recentes de cada loja","las más recientes de cada tienda","the most recent for each store") : L3("na ordem de relevância do Google","en el orden de relevancia de Google","in Google's relevance order");
const LOJA = Object.fromEntries(LOJAS.map(l=>[l.id,l]));
// Imobiliaria nao tem grafico de movimento no Google: sem pico, some a aba
// Movimento, o filtro de dia e as colunas e blocos de pico.
const TEM_PICO = LOJAS.some(l=>Object.values(l.pico||{}).some(h=>Object.values(h||{}).some(v=>v>0)));
const REVS = D.avaliacoes.map((r,i)=>({...r, i, marca:LOJA[r.s].marca, temas:r.t?TODOS.filter(t=>t.re.test(r.t)).map(t=>t.id):[]}));
const SHOPPINGS = [...new Set(LOJAS.map(l=>l.shopping))].sort((a,b)=>{
  const na = new Set(LOJAS.filter(l=>l.shopping===a).map(l=>l.marca)).size;
  const nb = new Set(LOJAS.filter(l=>l.shopping===b).map(l=>l.marca)).size;
  return nb-na || a.localeCompare(b);
});
const notaLoja = l => { const t=[1,2,3,4,5].reduce((a,k)=>a+(l.dist?.[k]||0),0); return t ? [1,2,3,4,5].reduce((a,k)=>a+k*(l.dist?.[k]||0),0)/t : l.nota; };
const repLoja = (l, amostra) => {
  if(amostra){ const rs=amostra.filter(r=>r.s===l.id), n=rs.length;
    return {nota:n?rs.reduce((a,r)=>a+r.e,0)/n:null, total:n, neg:n?rs.filter(r=>r.e<=2).length/n*100:null}; }
  const dt=[1,2,3,4,5].reduce((a,k)=>a+(l.dist?.[k]||0),0);
  return {nota:notaLoja(l), total:l.total ?? (dt||null), neg:dt?((l.dist[1]||0)+(l.dist[2]||0))/dt*100:null};
};
const marcasNoShopping = s => new Set(LOJAS.filter(l=>l.shopping===s).map(l=>l.marca));

const PERIODOS = [
  {id:"todos", nome:L3("Todos","Todos","All"), ok:()=>true},
  {id:"12", nome:L3("Último ano","Último año","Last year"), ok:m=>m!=null&&m<=12.5},
  {id:"36", nome:L3("1 a 3 anos","1 a 3 años","1 to 3 years"), ok:m=>m!=null&&m>12.5&&m<=36.5},
  {id:"mais", nome:L3("Mais de 3 anos","Más de 3 años","Over 3 years"), ok:m=>m!=null&&m>36.5},
];
const _FX = L3(["Mais de 3 anos","2 a 3 anos","1 a 2 anos","Último ano"],["Más de 3 años","2 a 3 años","1 a 2 años","Último año"],["Over 3 years","2 to 3 years","1 to 2 years","Last year"]);
const idadeFaixa = m => m==null?"?": m<=12.5?_FX[3]: m<=24.5?_FX[2]: m<=36.5?_FX[1]:_FX[0];
// Com periodo_mensal_desde, a evolucao vira mes a mes (ex.: janeiro ate o mes da coleta)
const MESES_ABR = L3(["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"],["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"],["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]);
const MENSAL = (()=>{
  if(!D.periodo_mensal_desde) return null;
  const [a0,m0] = D.periodo_mensal_desde.split("-").map(Number);
  const [a1,m1] = D.coleta.slice(0,7).split("-").map(Number);
  const out=[]; for(let a=a0,m=m0; a<a1||(a===a1&&m<=m1); m===12?(a++,m=1):m++) out.push(`${a}-${String(m).padStart(2,"0")}`);
  return out;
})();
// do mais antigo para o mais recente, para ler a evolucao da esquerda para a direita
const FAIXAS = MENSAL ? MENSAL.map(k=>MESES_ABR[+k.slice(5)-1]+"/"+k.slice(2,4)) : _FX;
const faixaDe = r => MENSAL ? (MENSAL.includes(r.a) ? FAIXAS[MENSAL.indexOf(r.a)] : "?") : idadeFaixa(r.m);

/* ------------------------------------------------------------ agregacoes */
function curvaMarca(lojas, marca, dia){
  // media das lojas abertas em cada hora; exige metade das lojas com dado
  const ls = lojas.filter(l=>l.marca===marca);
  const dias = dia==="todos" ? DIAS : [dia];
  const out = {};
  const nLojas = {};
  for(const d of dias){
    const comDado = ls.filter(l=>Object.values(l.pico[d]||{}).some(v=>v>0));
    const minimo = Math.max(1, Math.ceil(comDado.length/2));
    for(const h of HORAS){
      const vs = comDado.map(l=>l.pico[d][h]).filter(v=>v>0);
      if(vs.length>=minimo){ (out[h] ||= []).push(vs.reduce((a,b)=>a+b,0)/vs.length); }
    }
    nLojas[d]=comDado.length;
  }
  const curva = {};
  for(const h in out){ curva[h] = out[h].reduce((a,b)=>a+b,0)/out[h].length; }
  return {curva, lojas: dia==="todos" ? Math.max(0,...Object.values(nLojas)) : nLojas[dia]};
}
function resumoCurva(c){
  const hs = Object.keys(c).map(Number);
  if(!hs.length) return null;
  const ord = [...hs].sort((a,b)=>c[b]-c[a]);
  return {pico:ord[0], valor:c[ord[0]], top:ord.slice(0,3), vazia:[...hs].sort((a,b)=>c[a]-c[b])[0], media:hs.reduce((s,h)=>s+c[h],0)/hs.length};
}
function picoSemana(lojas, marca){
  let best=null;
  for(const d of DIAS){ const r=resumoCurva(curvaMarca(lojas,marca,d).curva); if(r && (!best||r.valor>best.valor)) best={...r,dia:d}; }
  return best;
}
// Sem filtro de avaliacao: totais do Google. Com filtro (periodo, estrelas,
// tema ou busca): tudo sai da amostra filtrada, porque o total do Google nao
// tem data nem nota individual.
function reputacao(lojas, marca, amostra){
  const nLojas = lojas.filter(l=>l.marca===marca).length;
  if(amostra){
    const rs = amostra.filter(r=>r.marca===marca);
    const dist = {5:0,4:0,3:0,2:0,1:0}; rs.forEach(r=>{ dist[r.e]++; });
    const dtot = rs.length;
    const porLoja = lojas.filter(l=>l.marca===marca).map(l=>rs.filter(r=>r.s===l.id)).filter(x=>x.length);
    return {amostra:true, lojas:nLojas, dist, dtot, tot:dtot,
      nota: dtot ? rs.reduce((a,r)=>a+r.e,0)/dtot : null,
      simples: porLoja.length ? porLoja.reduce((a,x)=>a+x.reduce((b,r)=>b+r.e,0)/x.length,0)/porLoja.length : null,
      neg: dtot ? (dist[1]+dist[2])/dtot*100 : null};
  }
  const ls = lojas.filter(l=>l.marca===marca && l.total);
  const tot = ls.reduce((s,l)=>s+l.total,0);
  const dist = {5:0,4:0,3:0,2:0,1:0};
  ls.forEach(l=>{ for(const k in l.dist) dist[k]+=l.dist[k]; });
  const dtot = Object.values(dist).reduce((a,b)=>a+b,0);
  // Media de todas as avaliacoes, pela contagem de estrelas: evita o
  // arredondamento de uma casa que o Google aplica na nota de cada loja
  const nota = dtot ? [1,2,3,4,5].reduce((s,k)=>s+k*dist[k],0)/dtot : null;
  const simples = ls.length ? ls.reduce((s,l)=>s+l.nota,0)/ls.length : null;
  const neg = dtot ? (dist[1]+dist[2])/dtot*100 : null;
  return {amostra:false, nota, simples, tot, dist, dtot, neg, lojas: nLojas};
}
function revStats(revs){
  const txt = revs.filter(r=>r.t);
  const neg = revs.filter(r=>r.e<=2);
  return {
    n:revs.length, comTexto:txt.length,
    media: revs.length ? revs.reduce((s,r)=>s+r.e,0)/revs.length : null,
    negPct: revs.length ? neg.length/revs.length*100 : null,
    resp: revs.length ? revs.filter(r=>r.r).length/revs.length*100 : null,
    respNeg: neg.length ? neg.filter(r=>r.r).length/neg.length*100 : null,
    temas: Object.fromEntries(TODOS.map(t=>{
      const com = txt.filter(r=>r.temas.includes(t.id));
      return [t.id,{n:com.length, pct: txt.length? com.length/txt.length*100 : 0,
        neg: com.length? com.filter(r=>r.e<=2).length/com.length*100 : null}];
    })),
  };
}

// Posiciona cada gota no item ativo do seu grupo. Observa a troca de aria-pressed/aria-selected
// em qualquer lugar da pagina, entao funciona tambem nos grupos que re-renderizam sozinhos.
const GOTA_VISTOS = new WeakSet();
let gotaRO = null;
function posicionarGotas(){
  document.querySelectorAll(".gota").forEach(g=>{
    const c = g.parentElement;
    if(gotaRO && !GOTA_VISTOS.has(c)){ GOTA_VISTOS.add(c); gotaRO.observe(c); }
    const a = c.querySelector(':scope > [aria-selected="true"], :scope > [aria-pressed="true"]');
    if(!a){ g.classList.remove("on"); return; }
    g.style.setProperty("--x", a.offsetLeft+"px"); g.style.setProperty("--y", a.offsetTop+"px");
    g.style.setProperty("--w", a.offsetWidth+"px"); g.style.setProperty("--h", a.offsetHeight+"px");
    g.classList.add("on");
    if(!g.classList.contains("pronta")) setTimeout(()=>g.classList.add("pronta"),60);
  });
}
(function(){
  let pend = 0;
  const agenda = () => { if(pend) return; pend = setTimeout(()=>{ pend = 0; posicionarGotas(); },0); };
  new MutationObserver(agenda).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:["aria-pressed","aria-selected","class"]});
  gotaRO = new ResizeObserver(agenda); gotaRO.observe(document.body);
  addEventListener("resize",agenda);
  document.addEventListener("transitionend",e=>{ if(e.target.classList&&e.target.classList.contains("app")) agenda(); });
})();

/* grafico de linhas com cruz e dica */
function LineChart({series,height=300,yMax=100,xs=HORAS,fmtX=hh,fmtV=v=>pct(v),tipTitle=h=>`${hh(h)} ${L3("às","a","to")} ${hh(h+1)}`,ticks=[0,25,50,75,100],yMin=0,every=3,label=L3("Movimento por hora, uma linha por marca","Afluencia por hora, una línea por marca","Hourly busyness, one line per brand")}){
  const ref = useRef(null);
  const [w,setW] = useState(700);
  const [hover,setHover] = useState(null);
  useEffect(()=>{ const ro=new ResizeObserver(e=>setW(e[0].contentRect.width)); ro.observe(ref.current); return ()=>ro.disconnect(); },[]);
  if(xs===HORAS){
    // So as horas em que alguma marca tem dado, com uma hora de folga de cada lado
    const com = HORAS.filter(h=>series.some(s=>s.pts[h]!=null));
    if(com.length>1){ const a=Math.max(HORAS[0],com[0]-1), b=Math.min(HORAS[HORAS.length-1],com[com.length-1]+1); xs=HORAS.filter(h=>h>=a&&h<=b); every=xs.length>12?2:1; }
    const vals = series.flatMap(s=>Object.values(s.pts).filter(v=>v!=null));
    if(vals.length && yMin===0){ yMin = Math.max(0, Math.floor((Math.min(...vals)-8)/25)*25); ticks = ticks.filter(t=>t>=yMin); }
  }
  const m = {l:34,r:14,t:12,b:26};
  const iw = Math.max(10,w-m.l-m.r), ih = height-m.t-m.b;
  const x = v => m.l + (xs.indexOf(v))/(xs.length-1)*iw;
  const y = v => m.t + ih - (v-yMin)/(yMax-yMin)*ih;
  const path = pts => {
    let d="", pen=false;
    xs.forEach(h=>{ const v=pts[h]; if(v==null){pen=false;return;} d += (pen?"L":"M")+x(h).toFixed(1)+","+y(v).toFixed(1); pen=true; });
    return d;
  };
  const onMove = e => {
    const r = ref.current.getBoundingClientRect();
    const px = e.clientX - r.left;
    const i = Math.round((px-m.l)/iw*(xs.length-1));
    setHover(i>=0&&i<xs.length ? xs[i] : null);
  };
  return html`<div class="chartwrap" ref=${ref} onMouseMove=${onMove} onMouseLeave=${()=>setHover(null)}>
    <svg width=${w} height=${height} role="img" aria-label=${label}>
      ${ticks.map(t=>html`<g key=${t}><line x1=${m.l} x2=${m.l+iw} y1=${y(t)} y2=${y(t)} stroke="var(--line)" stroke-dasharray=${t?"2 4":""}/><text x=${m.l-8} y=${y(t)+3.5} text-anchor="end">${fmt(t,t%1?1:0)}</text></g>`)}
      ${xs.filter((h,i)=>i%every===0).map((h,i,a)=>html`<text key=${h} x=${x(h)} y=${height-8} text-anchor=${a.length>1&&i===a.length-1&&every===1?"end":a.length>1&&i===0&&every===1?"start":"middle"}>${fmtX(h)}</text>`)}
      ${hover!=null && html`<rect x=${x(hover)-iw/(xs.length-1)/2} y=${m.t} width=${iw/(xs.length-1)} height=${ih} rx="8" fill="var(--sunk)" opacity="0.7"/>`}
      ${series.map(s=>html`<g key=${s.m}>
        ${(()=>{ if(xs.length<30) return null; const hs=xs.filter(h=>s.pts[h]!=null); if(hs.length<2) return null;
          const contiguo = hs.every((h,i)=>i===0||xs.indexOf(h)-xs.indexOf(hs[i-1])===1);
          if(!contiguo) return null;
          const area = path(s.pts)+`L${x(hs[hs.length-1]).toFixed(1)},${y(yMin).toFixed(1)}L${x(hs[0]).toFixed(1)},${y(yMin).toFixed(1)}Z`;
          const gid = "grad-"+label.length+"-"+MI[s.m];
          return html`<g><defs><linearGradient id=${gid} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color=${cor(s.m)} stop-opacity="0.08"/><stop offset="1" stop-color=${cor(s.m)} stop-opacity="0"/>
            </linearGradient></defs><path d=${area} fill=${`url(#${gid})`}/></g>`; })()}
        <path d=${path(s.pts)} fill="none" stroke=${cor(s.m)} stroke-opacity="0.14" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
        <path class="linha" pathLength="1" d=${path(s.pts)} fill="none" stroke="var(--panel)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
        <path class="linha" pathLength="1" d=${path(s.pts)} fill="none" stroke=${cor(s.m)} stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
        ${(()=>{const r=resumoCurva(s.pts); if(!r) return null; return html`<g>
          <circle cx=${x(r.pico)} cy=${y(r.valor)} r="12" fill=${cor(s.m)} opacity="0.16"/>
          <circle cx=${x(r.pico)} cy=${y(r.valor)} r="7" fill=${cor(s.m)} stroke="var(--panel)" stroke-width="3"/>
        </g>`})()}
      </g>`)}
      ${hover!=null && html`<g>
        ${series.map(s=>s.pts[hover]!=null && html`<circle key=${s.m} cx=${x(hover)} cy=${y(s.pts[hover])} r="6.5" fill=${cor(s.m)} stroke="var(--panel)" stroke-width="3"/>`)}
      </g>`}
    </svg>
    ${hover!=null && html`<div class="tip" style=${{left:Math.min(Math.max(x(hover),90),w-90), top:m.t+4}}>
      <div class="tt">${tipTitle(hover)}</div>
      ${[...series].sort((a,b)=>(b.pts[hover]??-1)-(a.pts[hover]??-1)).map(s=>html`<div class="tr" key=${s.m}><span><${Swatch} m=${s.m} size=${9}/>${s.m}</span><b class="num">${s.pts[hover]!=null?fmtV(s.pts[hover]):L3("sem dado","sin dato","no data")}</b></div>`)}
    </div>`}
  </div>`;
}

function Evolucao({idade}){
  const todos = idade.flatMap(x=>Object.values(x.pts));
  if(!todos.length) return html`<div class="empty">${L3("Sem avaliações suficientes neste recorte","No hay suficientes reseñas en esta selección","Not enough reviews for this selection")}</div>`;
  const lo = Math.min(...todos), hi = Math.max(...todos);
  const pad = Math.max(0.15,(hi-lo)*0.15);
  const y0 = lo-pad, y1 = hi+pad;
  const H = 64, n = FAIXAS.length;
  const cx = i => (i+0.5)/n*100;
  const cy = v => 14 + (1-(v-y0)/(y1-y0))*(H-30);
  return html`<div class="evo">
    <div class="evo-row evo-head">
      <span></span>
      <div class="evo-cols" style=${{gridTemplateColumns:`repeat(${FAIXAS.length},minmax(0,1fr))`}}>${FAIXAS.map(f=>html`<span key=${f}>${f}</span>`)}</div>
      <span style=${{textAlign:"right"}}>${L3("Variação","Variación","Change")}</span>
    </div>
    ${idade.map(x=>{
      const idx = Object.keys(x.pts).map(Number).sort((a,b)=>a-b);
      const pts = idx.map(i=>[cx(i),cy(x.pts[i])]);
      const primeiro = idx[0], ultimo = idx[idx.length-1];
      // Compara o periodo mais recente com dado contra o mais antigo com dado
      const delta = idx.length>1 ? x.pts[ultimo]-x.pts[primeiro] : null;
      const tom = delta==null?"t-info":delta<=-0.15?"t-crit":delta>=0.15?"t-good":"t-info";
      return html`<div class="evo-row" key=${x.m}>
        <${Brand} m=${x.m}/>
        <div class="evo-plot" style=${{height:H}}>
          <svg viewBox=${`0 0 100 ${H}`} preserveAspectRatio="none" aria-hidden="true">
            ${FAIXAS.map((f,i)=>html`<line key=${f} x1=${cx(i)} x2=${cx(i)} y1="4" y2=${H-4} stroke="var(--line)" vector-effect="non-scaling-stroke"/>`)}
            ${pts.length>1 && html`<polyline points=${pts.map(p=>p.join(",")).join(" ")} fill="none" stroke=${cor(x.m)} stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`}
          </svg>
          ${FAIXAS.map((f,i)=>{
            const v = x.pts[i];
            if(v==null) return html`<div key=${f} class="evo-pt" style=${{left:cx(i)+"%",top:H/2-8}} title=${x.n[i]?L3(`${x.n[i]} avaliações, poucas para uma média`,`${x.n[i]} reseñas, pocas para un promedio`,`${x.n[i]} reviews, too few for an average`):L3("sem avaliações","sin reseñas","no reviews")}><span class="note">${x.n[i]?"("+x.n[i]+")":"–"}</span></div>`;
            return html`<div key=${f} class="evo-pt" style=${{left:cx(i)+"%",top:cy(v)-5}} title=${`${x.m}, ${f}: ${fmt(v,2)} ${L3("em","en","from")} ${x.n[i]} ${L3("avaliações","reseñas","reviews")}`}>
              <i class=${"sh"+MI[x.m]} style=${{background:cor(x.m),borderRadius:MI[x.m]===0?"50%":MI[x.m]===1?"2px":0}}></i>
              <b class="num">${fmt(v,2)}</b>
            </div>`;
          })}
        </div>
        <div style=${{textAlign:"right"}}>${delta==null?html`<span class="note">–</span>`:html`<span class=${"tag "+tom} style=${{fontSize:12,letterSpacing:0}}>${delta>0?"▲":delta<0?"▼":"●"} ${fmt(Math.abs(delta),2)}</span>`}</div>
      </div>`;
    })}
    <p class="note" style=${{margin:"6px 0 0"}}>${L3("Amostra por período","Muestra por período","Sample per period")}: ${idade.map(x=>`${x.m} ${FAIXAS.map((f,i)=>x.n[i]).join(" · ")}`).join("  |  ")}</p>
  </div>`;
}

/* ------------------------------------------------------------ abas */
function Panorama({lojas,revs,revsTemas,revsNeg,amostra,dia,setTab,setTema}){
  const dados = MARCAS.map(m=>{
    const rep = reputacao(lojas,m,amostra);
    const st = revStats(revs.filter(r=>r.marca===m));
    const stT = revStats(revsTemas.filter(r=>r.marca===m));
    const pk = dia==="todos" ? picoSemana(lojas,m) : (()=>{const r=resumoCurva(curvaMarca(lojas,m,dia).curva); return r&&{...r,dia};})();
    const stNeg = revStats(revsNeg.filter(r=>r.marca===m));
    const piorTema = TEMAS.map(t=>({t,neg:stNeg.temas[t.id].neg,n:stNeg.temas[t.id].n})).filter(x=>x.n>=10&&x.neg!=null).sort((a,b)=>b.neg-a.neg)[0];
    const stN = stNeg;
    return {m,rep,st,stT,stN,pk,piorTema};
  });
  const melhor = (k,dir=1)=>{
    const vs=dados.filter(d=>d.rep.lojas&&k(d)!=null); if(vs.length<2) return {};
    const s=[...vs].sort((a,b)=>dir*(k(b)-k(a)));
    const topo=k(s[0]), fundo=k(s[s.length-1]);
    if(Math.abs(topo-fundo)<0.005) return {};  // empate: nenhum selo
    const unico = v => vs.filter(d=>Math.abs(k(d)-v)<0.005).length===1;
    return {best:unico(topo)?s[0].m:null, worst:unico(fundo)?s[s.length-1].m:null};
  };
  const rkNota = melhor(d=>d.rep.nota), rkNeg = melhor(d=>d.rep.neg,-1), rkResp = melhor(d=>d.st.resp);

  const insights = useMemo(()=>{
    const out=[];
    const com = dados.filter(d=>d.rep.nota!=null);
    // Lista com todas as marcas: "A 4,7, B 4,6 e C 4,4"
    const serie = (arr,f) => arr.map(f).reduce((txt,item,i,a)=> txt + (i===0?"":(i===a.length-1?L3(" e "," y "," and "):", ")) + item, "");
    if(com.length>=2){
      const sN=[...com].sort((a,b)=>b.rep.nota-a.rep.nota);
      out.push({k:"t-info",t:L3("Nota","Nota","Rating"),x:L3(
        `${serie(sN,d=>`${d.m} ${fmt(d.rep.nota,2)}`)}. Da primeira para a última vão ${fmt(sN[0].rep.nota-sN[sN.length-1].rep.nota,2)} ponto.`,
        `${serie(sN,d=>`${d.m} ${fmt(d.rep.nota,2)}`)}. De la primera a la última hay ${fmt(sN[0].rep.nota-sN[sN.length-1].rep.nota,2)} punto.`,
        `${serie(sN,d=>`${d.m} ${fmt(d.rep.nota,2)}`)}. From first to last there is a ${fmt(sN[0].rep.nota-sN[sN.length-1].rep.nota,2)} point gap.`)});
      const s=[...com].sort((a,b)=>b.rep.neg-a.rep.neg);
      out.push({k:"t-crit",t:L3("Atenção","Atención","Watch out"),x:L3(
        `Notas 1 e 2 ${amostra?"na amostra filtrada":"no Google"}: ${serie(s,d=>`${d.m} ${pct(d.rep.neg,1)}`)}.`,
        `Notas 1 y 2 ${amostra?"en la muestra filtrada":"en Google"}: ${serie(s,d=>`${d.m} ${pct(d.rep.neg,1)}`)}.`,
        `1 and 2 star ratings ${amostra?"in the filtered sample":"on Google"}: ${serie(s,d=>`${d.m} ${pct(d.rep.neg,1)}`)}.`)});
    }
    const dt = D.destaque_tema && TEMA_POR_ID[D.destaque_tema] ? D.destaque_tema : null;
    const cart = dt ? dados.map(d=>({m:d.m,v:d.stT.temas[dt].n,p:d.stT.temas[dt].pct})).sort((a,b)=>b.v-a.v) : [];
    if(cart.length && cart[0].v>=5) out.push({k:"t-warn",t:L3("Tema","Tema","Topic"),x:L3(
        `${TEMA_POR_ID[dt].nome} aparece em ${fmt(cart[0].v)} avaliações ${de(cart[0].m)} (${pct(cart[0].p,1)} das que têm texto).`,
        `${TEMA_POR_ID[dt].nome} aparece en ${fmt(cart[0].v)} reseñas ${de(cart[0].m)} (${pct(cart[0].p,1)} de las que tienen texto).`,
        `${TEMA_POR_ID[dt].nome} shows up in ${fmt(cart[0].v)} reviews for ${cart[0].m} (${pct(cart[0].p,1)} of those with text).`)+(TR("destaque_texto")?" "+TR("destaque_texto"):""),tema:dt});
    const fila = TEMA_POR_ID.fila ? dados.map(d=>({m:d.m,neg:d.stN.temas.fila.neg,n:d.stN.temas.fila.n})).filter(x=>x.n>=10).sort((a,b)=>b.neg-a.neg) : [];
    if(fila.length) out.push({k:"t-warn",t:L3("Operação","Operación","Operations"),x:L3(
        `Quando falam de fila e caixa, ${pct(fila[0].neg)} das avaliações ${de(fila[0].m)} são negativas.`,
        `Cuando hablan de filas y caja, ${pct(fila[0].neg)} de las reseñas ${de(fila[0].m)} son negativas.`,
        `When people mention queues and checkout, ${pct(fila[0].neg)} of reviews for ${fila[0].m} are negative.`),tema:"fila"});
    const pk = dados.filter(d=>d.pk).map(d=>`${d.m} ${DIA_LONGO[d.pk.dia]} ${L3("às","a las","at")} ${hh(d.pk.pico)}`);
    if(pk.length) out.push({k:"t-info",t:L3("Movimento","Afluencia","Busyness"),x:`${dia==="todos"?L3("Pico da semana","Pico de la semana","Weekly peak"):L3("Pico de ","Pico del ","Peak on ")+DIA_LONGO[dia]}: ${pk.join(", ")}.`,tab:"movimento"});
    // Onde cada marca mais apanha, com a base junto: em tema de nicho o
    // percentual costuma vir de 6 a 10 avaliacoes, e sem o "em N" engana
    const MIN_TEMA = 5;
    const criticos = dados.map(d=>{
      const t = NETS.map(n=>({nome:n.nome, id:n.id, ...d.stN.temas[n.id]}))
        .filter(x=>x.n>=MIN_TEMA && x.neg!=null && x.neg>0).sort((a,b)=>b.neg-a.neg)[0];
      return t ? {m:d.m, ...t} : null;
    }).filter(Boolean).sort((a,b)=>b.neg-a.neg);
    if(criticos.length) out.push({k:"t-warn",t:L3("Pior tema de cada uma","Peor tema de cada una","Each one's worst topic"),x:
      serie(criticos,c=>L3(`${c.m} em ${c.nome} (${pct(c.neg)} de ${fmt(c.n)} avaliações)`,
        `${c.m} en ${c.nome} (${pct(c.neg)} de ${fmt(c.n)} reseñas)`,
        `${c.m} on ${c.nome} (${pct(c.neg)} of ${fmt(c.n)} reviews)`))+"."});
    // Um net que domina em todas as marcas diz mais que a media de cada uma
    const dom = NETS.map(n=>({n, vs:dados.map(d=>({m:d.m, p:d.stT.temas[n.id].pct, q:d.stT.temas[n.id].n}))}))
      .filter(x=>x.vs.every(v=>v.p>=50 && v.q>=MIN_TEMA))
      .sort((a,b)=>b.vs.reduce((s,v)=>s+v.p,0)-a.vs.reduce((s,v)=>s+v.p,0))[0];
    if(dom) out.push({k:"t-info",t:L3("O que domina a conversa","Lo que domina la conversación","What dominates the conversation"),x:L3(
      `${dom.n.nome} aparece em ${serie([...dom.vs].sort((a,b)=>b.p-a.p),(v,i)=>`${pct(v.p)} ${i===0?"das avaliações com texto ":""}${de(v.m)}`)}.`,
      `${dom.n.nome} aparece en ${serie([...dom.vs].sort((a,b)=>b.p-a.p),(v,i)=>`${pct(v.p)} ${i===0?"de las reseñas con texto ":""}${de(v.m)}`)}.`,
      `${dom.n.nome} shows up in ${serie([...dom.vs].sort((a,b)=>b.p-a.p),(v,i)=>`${pct(v.p)} ${i===0?"of text reviews for ":"for "}${v.m}`)}.`), tema:dom.n.id});
    const resp = dados.filter(d=>d.st.respNeg!=null).sort((a,b)=>b.st.respNeg-a.st.respNeg);
    if(resp.length>=2) out.push({k:"t-good",t:L3("Relacionamento","Relación","Engagement"),x:L3(
        `Resposta a avaliação negativa: ${serie(resp,d=>`${d.m} ${pct(d.st.respNeg)}`)}.`,
        `Respuesta a reseña negativa: ${serie(resp,d=>`${d.m} ${pct(d.st.respNeg)}`)}.`,
        `Replies to negative reviews: ${serie(resp,d=>`${d.m} ${pct(d.st.respNeg)}`)}.`)});
    // So avisa da amostra desigual quando ela e mesmo desigual
    const lidas = dados.map(d=>({m:d.m, n:d.st.n})).filter(x=>x.n).sort((a,b)=>b.n-a.n);
    if(lidas.length>=2 && lidas[0].n >= 3*lidas[lidas.length-1].n) out.push({k:"t-info",t:L3("Tamanho da amostra","Tamaño de la muestra","Sample size"),x:L3(
      `As bases são desiguais: ${serie(lidas,x=>`${x.m} ${fmt(x.n)}`)} avaliações lidas. Percentual de quem tem base pequena oscila mais.`,
      `Las bases son desiguales: ${serie(lidas,x=>`${x.m} ${fmt(x.n)}`)} reseñas leídas. El porcentaje de quien tiene base pequeña oscila más.`,
      `Sample sizes differ: ${serie(lidas,x=>`${x.m} ${fmt(x.n)}`)} reviews read. Percentages on the smaller bases move more.`)});
    return out;
  },[lojas,revs,revsTemas,revsNeg,amostra,dia]);

  return html`<div>
    <div class="grid g3">
      ${dados.map(d=>html`<article class="brandcard" key=${d.m} aria-label=${L3("Resumo ","Resumen ","Summary ")+d.m}>
        <div class="bc-head">
          <div class="bc-name"><${Swatch} m=${d.m} size=${14}/>${d.m}</div>
          <div class="bc-stores">${d.rep.lojas} ${d.rep.lojas===1?L3("loja","tienda","store"):L3("lojas","tiendas","stores")}</div>
        </div>
        ${d.rep.lojas===0 ? html`<div class="empty">${L3("Sem loja neste recorte","Sin tiendas en esta selección","No stores in this selection")}</div>` : html`
        <div class="bc-hero">
          <div class="bc-big num">${fmt(d.rep.nota,2)}</div>
          <div class="bc-stars"><${Stars} v=${d.rep.nota} size=${15}/><span class="note" style=${{display:"inline-flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>${d.rep.amostra?L3("nota média da amostra filtrada","nota media de la muestra filtrada","average of the filtered sample"):L3("nota média ponderada","nota media ponderada","weighted average rating")} <${InfoTip} label=${L3("Como a nota é calculada","Cómo se calcula la nota","How the rating is calculated")}>
            ${d.rep.amostra ? html`<p><b>${L3("Nota da amostra filtrada","Nota de la muestra filtrada","Filtered sample rating")}</b></p>
            <p>${L3("Com filtro de período, estrelas ou tema ligado, a nota é a média das avaliações lidas que passam no filtro:","Con un filtro de período, estrellas o tema activo, la nota es el promedio de las reseñas leídas que pasan el filtro:","With a period, star or topic filter on, the rating is the average of the collected reviews that pass the filter:")} <b class="num">${fmt(d.rep.dtot)}</b> ${L3("avaliações","reseñas","reviews")}.</p>
            <p>${L3("O total do Google não tem data nem nota individual, por isso não pode ser filtrado. Limpe esses filtros para voltar à nota ponderada de todas as avaliações do Google.","El total de Google no trae fecha ni nota individual, por eso no se puede filtrar. Quite esos filtros para volver a la nota ponderada de todas las reseñas de Google.","Google's totals have no date or per-review rating, so they cannot be filtered. Clear these filters to return to the weighted rating of all Google reviews.")}</p>
            <p>${L3("Média simples das lojas na amostra:","Promedio simple de las tiendas en la muestra:","Simple average across stores in the sample:")} <b class="num">${fmt(d.rep.simples,2)}</b>.</p>` : html`
            <p><b>${L3("Nota média ponderada","Nota media ponderada","Weighted average rating")}</b></p>
            <p>${L3(`É a média de todas as avaliações do Google das lojas ${de(d.m)} no recorte, calculada pela contagem de estrelas (quantas de 5★, 4★, 3★, 2★ e 1★).`,`Es el promedio de todas las reseñas de Google de las tiendas ${de(d.m)} en la selección, calculado por el conteo de estrellas (cuántas de 5★, 4★, 3★, 2★ y 1★).`,`It is the average of all Google reviews for ${d.m} stores in the selection, computed from the star counts (how many 5★, 4★, 3★, 2★ and 1★).`)}</p>
            <p>${L3("Cada avaliação pesa igual. Por isso uma loja com 3.800 avaliações pesa mais que uma com 24, e a nota reflete o que a maioria dos clientes disse.","Cada reseña pesa lo mismo. Por eso una tienda con 3.800 reseñas pesa más que una con 24, y la nota refleja lo que dijo la mayoría de los clientes.","Every review counts the same, so a store with 3,800 reviews weighs more than one with 24, and the rating reflects what most shoppers said.")}</p>
            <p>${L3("Não usamos a nota arredondada que o Google mostra em cada loja (por exemplo 4,3), para não esconder diferenças pequenas entre as marcas.","No usamos la nota redondeada que Google muestra en cada tienda (por ejemplo 4,3), para no ocultar diferencias pequeñas entre las marcas.","We do not use the rounded rating Google shows per store (for example 4.3), so small gaps between brands stay visible.")}</p>
            <p>${L3("Base:","Base:","Base:")} <b class="num">${fmt(d.rep.dtot)}</b> ${L3("avaliações. Média simples das lojas, sem peso:","reseñas. Promedio simple de las tiendas, sin ponderar:","reviews. Unweighted average across stores:")} <b class="num">${fmt(d.rep.simples,2)}</b>.</p>`}
          </${InfoTip}>${rkNota.best===d.m?html`<span class="rank r-best">${L3("melhor","mejor","best")}</span>`:rkNota.worst===d.m?html`<span class="rank r-worst">${L3("menor","menor","lowest")}</span>`:null}</span></div>
        </div>
        <dl class="kv">
          <div><dt>${d.rep.amostra?L3("Avaliações no filtro","Reseñas en el filtro","Reviews in filter"):L3("Avaliações no Google","Reseñas en Google","Google reviews")}</dt><dd class="num">${fmt(d.rep.tot)}</dd></div>
          <div><dt>${L3("Notas 1 e 2","Notas 1 y 2","1 and 2 stars")}</dt><dd class="num">${pct(d.rep.neg,1)}${rkNeg.best===d.m?html`<span class="rank r-best">${L3("menor","menor","lowest")}</span>`:rkNeg.worst===d.m?html`<span class="rank r-worst">${L3("maior","mayor","highest")}</span>`:null}</dd></div>
          ${TEM_PICO?html`<div><dt>${dia==="todos"?L3("Pico da semana","Pico de la semana","Weekly peak"):L3("Pico do dia","Pico del día","Daily peak")}</dt><dd>${d.pk?html`<span>${DIA_CURTO[d.pk.dia]} ${hh(d.pk.pico)}</span> <span class="num note">${pct(d.pk.valor)}</span>`:"–"}</dd></div>`:null}
          <div><dt>${L3("Responde a loja","Respuesta de la tienda","Store replies")}</dt><dd class="num">${pct(d.st.resp)}${rkResp.best===d.m?html`<span class="rank r-best">${L3("mais","más","most")}</span>`:null}</dd></div>
          <div><dt>${d.rep.amostra?L3("Total no Google","Total en Google","Google total"):L3("Avaliações lidas","Reseñas leídas","Reviews read")}</dt><dd class="num">${fmt(d.rep.amostra?reputacao(lojas,d.m).tot:d.st.n)}</dd></div>
          <div><dt>${L3("Tema mais crítico","Tema más crítico","Most critical topic")}</dt><dd>${d.piorTema?html`<button class="linkbtn" style=${{padding:0,fontSize:14,fontWeight:600,color:"var(--ink)"}} onClick=${()=>{setTema(d.piorTema.t.id);setTab("voz");}}>${d.piorTema.t.nome}</button> <span class="num note">${pct(d.piorTema.neg)} ${L3("neg.","neg.","neg.")}</span>`:"–"}</dd></div>
        </dl>`}
      </article>`)}
    </div>

    <div class=${TEM_PICO?"grid g21":"grid"}>
      ${TEM_PICO?html`<section class="panel">
        <div class="ph"><div><h2>${dia==="todos"?L3("Movimento médio da semana","Afluencia media de la semana","Average weekly busyness"):L3("Movimento de ","Afluencia del ","Busyness on ")+DIA_LONGO[dia]}</h2><p class="sub">${L3("Percentual de lotação por hora no Google, média das lojas abertas. O ponto marca o pico de cada marca.","Porcentaje de afluencia por hora en Google, promedio de las tiendas abiertas. El punto marca el pico de cada marca.","Google's hourly busyness percentage, averaged across open stores. The dot marks each brand's peak.")}</p></div>
          <button class="linkbtn" onClick=${()=>setTab("movimento")}>${L3("Abrir movimento","Ver afluencia","Open busyness")}</button></div>
        <${LineChart} series=${MARCAS.map(m=>({m,pts:curvaMarca(lojas,m,dia).curva}))}/>
      </section>`:null}
      <section class="panel">
        <div class="ph"><div><h2>${L3("Leitura rápida","Lectura rápida","Quick read")}</h2><p class="sub">${L3("Gerada a partir do recorte atual.","Generada a partir de la selección actual.","Generated from the current selection.")}</p></div></div>
        <ul class="insights">
          ${insights.map((it,i)=>html`<li key=${i}><span class=${"tag "+it.k}>${it.t}</span><span>${it.x}${it.tema&&html` <button class="linkbtn" onClick=${()=>{setTema(it.tema);setTab("voz");}}>${L3("ver avaliações","ver reseñas","see reviews")}</button>`}</span></li>`)}
        </ul>
      </section>
    </div>

    <section class="panel" style=${{marginTop:16}}>
      <div class="ph"><div><h2>${L3("Do que os clientes falam","De qué hablan los clientes","What shoppers talk about")}</h2><p class="sub">${L3("Parcela das avaliações com texto que citam cada net (grupo de códigos). Mostra todos os temas mesmo com filtro de tema ligado. Clique num tema para ler as avaliações.","Proporción de reseñas con texto que citan cada net (grupo de códigos). Muestra todos los temas aunque haya un filtro de tema activo. Haga clic en un tema para leer las reseñas.","Share of reviews with text that mention each net (a group of codes). All topics stay visible even with a topic filter on. Click a topic to read the reviews.")}</p></div></div>
      <div class="grid g2" style=${{marginTop:0}}>
        <${GroupBars} rows=${NETS.slice(0,Math.ceil(NETS.length/2)).map(t=>({id:t.id,nome:t.nome,sub:nCod(t.net),v:Object.fromEntries(dados.map(d=>[d.m,d.rep.lojas?d.stT.temas[t.id].pct:null]))}))} max=${escala(dados.flatMap(d=>NETS.map(t=>d.stT.temas[t.id].pct)))} onPick=${id=>{setTema(id);setTab("voz");}}/>
        <${GroupBars} rows=${NETS.slice(Math.ceil(NETS.length/2)).map(t=>({id:t.id,nome:t.nome,sub:nCod(t.net),v:Object.fromEntries(dados.map(d=>[d.m,d.rep.lojas?d.stT.temas[t.id].pct:null]))}))} max=${escala(dados.flatMap(d=>NETS.map(t=>d.stT.temas[t.id].pct)))} onPick=${id=>{setTema(id);setTab("voz");}}/>
      </div>
    </section>
  </div>`;
}

function Movimento({lojas,dia,setDia}){
  const tabela = DIAS.map(d=>({d, r:Object.fromEntries(MARCAS.map(m=>[m,resumoCurva(curvaMarca(lojas,m,d).curva)]))}));
  const semana = Object.fromEntries(MARCAS.map(m=>[m,picoSemana(lojas,m)]));
  return html`<div>
    <section class="panel" style=${{marginTop:14}}>
      <div class="ph">
        <div><h2>${dia==="todos"?L3("Curva média da semana","Curva media de la semana","Average weekly curve"):L3("Curva de ","Curva del ","Curve for ")+DIA_LONGO[dia]}</h2><p class="sub">${L3("Passe o mouse para comparar as três marcas na mesma hora. Horas com menos da metade das lojas abertas ficam de fora da média.","Pase el mouse para comparar las tres marcas a la misma hora. Las horas con menos de la mitad de las tiendas abiertas quedan fuera del promedio.","Hover to compare the three brands at the same hour. Hours with fewer than half the stores open are left out of the average.")}</p></div>
        <div class="legend">${MARCAS.map(m=>html`<span class="lg" key=${m}><${Swatch} m=${m}/>${m}<span class="num note">${curvaMarca(lojas,m,dia).lojas||0} ${L3("lojas","tiendas","stores")}</span></span>`)}</div>
      </div>
      <${LineChart} series=${MARCAS.map(m=>({m,pts:curvaMarca(lojas,m,dia).curva}))} height=${360}/>
    </section>

    <div class="grid g3">
      ${MARCAS.map(m=>html`<section class="panel" key=${m}>
        <div class="ph"><div><h2 style=${{display:"flex",alignItems:"center",gap:8}}><${Swatch} m=${m}/>${m}</h2><p class="sub">${L3("Dia × hora. Clique no dia para filtrar.","Día × hora. Haga clic en el día para filtrar.","Day × hour. Click a day to filter.")}</p></div>
          ${semana[m] && html`<div style=${{textAlign:"right"}}><div class="flabel">${L3("Pico da semana","Pico de la semana","Weekly peak")}</div><div style=${{fontWeight:700}}>${DIA_CURTO[semana[m].dia]} ${hh(semana[m].pico)} <span class="num note">${pct(semana[m].valor)}</span></div></div>`}
        </div>
        <${Heat} lojas=${lojas} marca=${m} diaSel=${dia} onDia=${setDia}/>
      </section>`)}
    </div>

    <section class="panel" style=${{marginTop:16}}>
      <div class="ph"><div><h2>${L3("Horas mais cheias e pico de cada dia","Horas más concurridas y pico de cada día","Busiest hours and daily peak")}</h2><p class="sub">${L3("Para cada marca: a hora de pico com o percentual de lotação, as três horas mais cheias e a hora mais vazia enquanto a loja está aberta.","Para cada marca: la hora pico con el porcentaje de afluencia, las tres horas más concurridas y la hora más tranquila mientras la tienda está abierta.","For each brand: the peak hour with its busyness, the three busiest hours and the quietest hour while the store is open.")}</p></div></div>
      <div class="tablewrap"><table>
        <thead><tr><th>${L3("Dia","Día","Day")}</th>${MARCAS.map(m=>html`<th key=${m} colSpan="3"><${Brand} m=${m}/></th>`)}</tr>
          <tr><th></th>${MARCAS.map(m=>html`<${React.Fragment} key=${m}><th>${L3("Pico","Pico","Peak")}</th><th>${L3("3 mais cheias","3 más concurridas","3 busiest")}</th><th>${L3("Mais vazia","Más tranquila","Quietest")}</th></${React.Fragment}>`)}</tr></thead>
        <tbody>${tabela.map(row=>{
          const vals = MARCAS.map(m=>row.r[m]?.valor??-1); const mx=Math.max(...vals);
          return html`<tr key=${row.d} style=${{background: dia===row.d?"var(--panel-2)":null}}>
            <td><button class="linkbtn" style=${{padding:0,fontSize:13,fontWeight:700,color:"var(--ink)",textDecoration:dia===row.d?"underline":"none"}} onClick=${()=>setDia(dia===row.d?"todos":row.d)}>${cap(DIA_LONGO[row.d])}</button></td>
            ${MARCAS.map(m=>{const r=row.r[m]; return html`<${React.Fragment} key=${m}>
              <td class="num" style=${{whiteSpace:"nowrap"}}>${r?html`<b>${hh(r.pico)}</b> ${r.valor===mx?html`<span class="maxpk" style=${{background:cor(m),color:`var(--b${MI[m]}-ink,#fff)`}} title=${L3("Maior pico do dia entre as marcas","Mayor pico del día entre las marcas","Highest peak of the day among the brands")}>${pct(r.valor)}</span>`:html`<span style=${{color:"var(--ink-2)"}}>${pct(r.valor)}</span>`}`:html`<span class="note">${L3("fechada","cerrada","closed")}</span>`}</td>
              <td class="num note" style=${{whiteSpace:"nowrap"}}>${r?r.top.map(hh).join(" · "):""}</td>
              <td class="num note">${r?hh(r.vazia):""}</td>
            </${React.Fragment}>`;})}
          </tr>`;})}</tbody>
      </table></div>
      <p class="note" style=${{marginTop:8,display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>${L3("O percentual com fundo na cor da marca mostra quem tem o maior pico do dia entre as três. Exemplo:","El porcentaje con fondo del color de la marca indica quién tiene el mayor pico del día entre las tres. Ejemplo:","A percentage on the brand's color marks who has the highest peak of the day among the three. Example:")} <span class="maxpk" style=${{background:cor(MARCAS[0]),color:"var(--b0-ink,#fff)"}}>80%</span> ${L3(`seria a ${MARCAS[0]} liderando aquele dia.`,`sería ${MARCAS[0]} liderando ese día.`,`would be ${MARCAS[0]} leading that day.`)}</p>
    </section>

const relData = r => {
  if(LANG==="pt" || r.m==null) return r.d;
  const m = Math.round(r.m);
  if(r.m < 1) return L3("","hace menos de un mes","less than a month ago");
  if(m < 12) return L3("", m===1?"hace 1 mes":`hace ${m} meses`, m===1?"1 month ago":`${m} months ago`);
  const a = Math.round(r.m/12);
  return L3("", a===1?"hace 1 año":`hace ${a} años`, a===1?"1 year ago":`${a} years ago`);
};
function highlight(text, termo, tema){
  const res = [];
  if(termo) res.push(new RegExp(termo.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"));
  if(tema) res.push(new RegExp(TEMA_POR_ID[tema].re.source,"gi"));
  if(!res.length) return text;
  const re = new RegExp(res.map(r=>r.source).join("|"),"gi");
  const parts=[]; let last=0; let mm;
  while((mm=re.exec(text))){ if(mm[0]==="") {re.lastIndex++; continue;} parts.push(text.slice(last,mm.index)); parts.push(html`<mark key=${mm.index}>${mm[0]}</mark>`); last=mm.index+mm[0].length; }
  parts.push(text.slice(last));
  return parts;
}

function Lojas({lojas,revs,amostra,dia}){

  const box = {a:Math.min(...lat)-0.012,b:Math.max(...lat)+0.012,c:Math.min(...lng)-0.015,d:Math.max(...lng)+0.015};
  const W=620,H=440;
  const px = v => (v-box.c)/(box.d-box.c)*W;
  const py = v => (box.b-v)/(box.b-box.a)*H;
  // Agrupa por distancia real (cerca de 400 m), nao pelo nome do local:
  // lojas de redes diferentes no mesmo bairro podem estar longe uma da outra
  const grupos = [];
  lojas.forEach(l=>{
    const g = grupos.find(g=>Math.hypot(g.lat-l.lat, g.lng-l.lng) < 0.0036);
    if(g){ g.ls.push(l); } else grupos.push({lat:l.lat, lng:l.lng, ls:[l]});
  });
  // Rotulos sem sobreposicao: tenta posicoes em volta do ponto e, sem espaco,
  // afasta o texto com uma linha ate o ponto
  const nomeCurto = t => t.replace(/^Rua · /,"").replace(/^Loja de rua · /,"").replace(/^Loja de rua$/, L3("Loja de rua","Tienda de calle","Street store"));
  const larg = t => t.length*6.4 + 6, ALT = 15;
  const caixas = [];

    || grupos.some(g=>{const x=px(g.lng),y=py(g.lat); return x>b.x-9&&x<b.x+b.w+9&&y>b.y-9&&y<b.y+b.h+9;});
  const rotulos = [...grupos].sort((a,b)=>b.lat-a.lat).map((g,gi)=>{

    const ty = esc.y+ALT-4;
    const ax = Math.min(Math.max(cx, esc.x), esc.x+w), ay = Math.min(Math.max(cy, esc.y), esc.y+ALT);
    return {id:"g"+gi, ls:g.ls, cx, cy, texto, tx, ty, anchor:esc.a, ax, ay, puxado:Math.hypot(ax-cx, ay-cy)>24};

  });

  rows.sort((a,b)=>{const x=keyf[sort.k](a),y=keyf[sort.k](b); return (x>y?1:x<y?-1:0)*sort.dir;});

                <circle cx=${g.cx} cy=${g.cy} r="30" fill=${hov===g.id?"var(--chip)":"transparent"} />

                ${g.ls.map((l,i)=>{const ang = (i/g.ls.length)*Math.PI*2 - Math.PI/2; const r=g.ls.length>1?11:0; const x=g.cx+Math.cos(ang)*r, y=g.cy+Math.sin(ang)*r;
                  return MI[l.marca]===0 ? html`<circle key=${l.id} cx=${x} cy=${y} r="7" fill=${cor(l.marca)} stroke="var(--panel)" stroke-width="2"><title>${l.marca} · ${localNome(l.shopping)}</title></circle>`

                    : html`<path key=${l.id} d=${`M${x},${y-8} L${x+7.5},${y+6} L${x-7.5},${y+6} Z`} fill=${cor(l.marca)} stroke="var(--panel)" stroke-width="2"><title>${l.marca} · ${localNome(l.shopping)}</title></path>`;})}
                <text class="shop" x=${g.tx} y=${g.ty} text-anchor=${g.anchor} paint-order="stroke" stroke="var(--panel-2)" stroke-width="4" stroke-linejoin="round">${g.texto}</text>
              </g>`)}
          </svg>
        </div>
      </section>
      <section class="panel">
        <div class="ph"><div><h2>${L3("Presença por local","Presencia por lugar","Presence by location")}</h2><p class="sub">${L3("Onde as três marcas disputam o mesmo público.","Dónde las tres marcas compiten por el mismo público.","Where the three brands compete for the same shoppers.")}</p></div></div>

function renderMd(t){
  const linhas = t.split("\n"); const out=[]; let lista=null;
  const inline = s => { const parts=[]; const re=/\*\*(.+?)\*\*/g; let last=0,mm; while((mm=re.exec(s))){parts.push(s.slice(last,mm.index)); parts.push(html`<b key=${mm.index}>${mm[1]}</b>`); last=mm.index+mm[0].length;} parts.push(s.slice(last)); return parts; };
  linhas.forEach((l,i)=>{
    const li = l.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);
    if(li){ (lista ||= []).push(html`<li key=${i}>${inline(li[1])}</li>`); return; }
    if(lista){ out.push(html`<ul key=${"u"+i}>${lista}</ul>`); lista=null; }
    const h = l.match(/^#{1,4}\s+(.*)/);
    if(h) out.push(html`<h4 key=${i}>${inline(h[1])}</h4>`);
    else if(l.trim()) out.push(html`<p key=${i}>${inline(l)}</p>`);
  });
  if(lista) out.push(html`<ul key="uf">${lista}</ul>`);
  return out;
}

function contexto(lojas,revs,filtrosTxt,amostra){
  const marcas = MARCAS.map(m=>{

    return {marca:m, lojas:rep.lojas, nota_ponderada:+fmt(rep.nota,2).replace(",","."), avaliacoes_google:rep.tot, pct_notas_1e2:+(rep.neg||0).toFixed(1),
      amostra:st.n, media_amostra:st.media&&+st.media.toFixed(2), pct_respondidas:st.resp&&+st.resp.toFixed(0), pct_negativas_respondidas:st.respNeg&&+st.respNeg.toFixed(0),
      temas:Object.fromEntries(TODOS.map(t=>[(t.ehNet?"NET ":"")+t.nome,{citacoes:st.temas[t.id].n, pct_do_texto:+st.temas[t.id].pct.toFixed(1), pct_negativas:st.temas[t.id].neg==null?null:+st.temas[t.id].neg.toFixed(0)}])),
      pico_por_dia:Object.fromEntries(DIAS.map(d=>{const r=resumoCurva(curvaMarca(lojas,m,d).curva); return [d, r?{hora_pico:r.pico,lotacao:Math.round(r.valor),tres_mais_cheias:r.top,mais_vazia:r.vazia}:"fechada"];})),
    };
  });
  const porLoja = lojas.map(l=>{const rp=repLoja(l,amostra); return {marca:l.marca, local:l.shopping, nota:rp.nota==null?null:+rp.nota.toFixed(2), avaliacoes:rp.total, topicos_google:l.topicos};});
  const trechos = [];
  MARCAS.forEach(m=>{
    const rs = revs.filter(r=>r.marca===m&&r.t);
    const neg = rs.filter(r=>r.e<=2).slice(0,25), pos = rs.filter(r=>r.e>=4).slice(0,12), mid = rs.filter(r=>r.e===3).slice(0,5);
    [...neg,...mid,...pos].forEach(r=>trechos.push(`[${m} · ${LOJA[r.s].shopping} · ${r.e}★ · ${r.d}] ${r.t.slice(0,320)}`));
  });
  return `DADOS DO PAINEL (coleta ${D.coleta}, ${D.cidade}, fonte: fichas públicas do Google Maps; as avaliações estão no idioma original)
Filtros ativos: ${filtrosTxt}
${amostra?"Nota, avaliações e notas 1 e 2 abaixo saem da amostra filtrada, não do total do Google.":"Nota, avaliações e notas 1 e 2 abaixo são o total do Google."}
Lotação é o percentual de movimento que o Google mostra por hora. As avaliações são uma amostra ${FAIXA_AMOSTRA}, ${ORDEM_TXT}.

RESUMO POR MARCA (JSON):
${JSON.stringify(marcas)}

POR LOJA (JSON):
${JSON.stringify(porLoja)}

TRECHOS DE AVALIAÇÕES (${trechos.length}):
${trechos.join("\n")}`;
}

    <div class="callout" style=${{marginTop:0,marginBottom:14}}><b>Beta</b><span>${L3("Recurso em construção. As respostas são geradas por IA a partir dos dados do painel e podem ter imprecisões. Confira os números nas outras abas antes de usar.","Función en construcción. Las respuestas las genera una IA a partir de los datos del panel y pueden tener imprecisiones. Verifique los números en las otras pestañas antes de usarlos.","Work in progress. Answers are AI-generated from the dashboard data and may be inaccurate. Check the numbers in the other tabs before relying on them.")}</span></div>
    <div class="ph"><div><h2 style=${{display:"flex",alignItems:"center",gap:8}}>${L3("Pergunte ao painel","Pregunte al panel","Ask the dashboard")} <span class="beta">Beta</span></h2><p class="sub">${L3("O analista lê os números e trechos de avaliações do recorte atual","El analista lee los números y fragmentos de reseñas de la selección actual","The analyst reads the numbers and review excerpts in the current selection")} (${filtrosTxt}) ${L3("e responde comparando as três marcas. Cada pergunta usa a sua conta do Claude.","y responde comparando las tres marcas. Cada pregunta usa su cuenta de Claude.","and answers comparing the three brands. Each question uses your Claude account.")}</p></div></div>
    <div class="ask">
      <div class="sugg">${SUG.map(s=>html`<button key=${s} onClick=${()=>{setQ(s);perguntar(s);}} disabled=${!sample||estado!=="pronto"}>${s}</button>`)}</div>
      <label class="flabel" for="pergunta">${L3("Sua pergunta","Su pregunta","Your question")}</label>
      <textarea id="pergunta" value=${q} onInput=${e=>setQ(e.target.value)} placeholder=${L3(`Ex.: onde ${de(MARCAS[2]).replace(/^d/,"")} perde para ${de(MARCAS[1]).replace(/^d/,"")} no mesmo local?`,`Ej.: ¿dónde pierde ${MARCAS[2]} frente a ${MARCAS[1]} en el mismo lugar?`,`E.g.: where does ${MARCAS[2]} lose to ${MARCAS[1]} at the same location?`)}
        onKeyDown=${e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)) perguntar(q);}}></textarea>
      <div style=${{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        <button class="primary" onClick=${()=>perguntar(q)} disabled=${!sample||estado!=="pronto"||!q.trim()}>${sample===undefined?L3("Conectando…","Conectando…","Connecting…"):L3("Analisar","Analizar","Analyze")}</button>
        ${estado!=="pronto" && html`<button class="ghost" onClick=${()=>ctl.current?.abort()}>${L3("Parar","Detener","Stop")}</button>`}
        <span class="note">${L3("⌘ + Enter envia","⌘ + Enter envía","⌘ + Enter sends")}</span>
      </div>
      ${estado==="pensando" && html`<div class="thinking"><i></i><i></i><i></i> ${L3("Lendo os dados…","Leyendo los datos…","Reading the data…")}</div>`}
      ${erro && html`<div class="callout"><b>${L3("Aviso","Aviso","Note")}</b><span>${erro}</span></div>`}
      ${resp && html`<div class="answer">${renderMd(resp)}</div>`}
    </div>
  </section>`;
}
